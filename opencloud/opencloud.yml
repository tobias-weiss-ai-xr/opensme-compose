# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── OpenCloud + Collabora overlay ──────────────
# Include via: COMPOSE_FILE=docker-compose.yml:opencloud/opencloud.yml
# Provides file sync/sharing + online office editing.
#
# Storage backend: openCloud's built-in `ocis` (local POSIX filesystem,
# files live in the opencloud-data volume). This avoids the MinIO/S3
# decomposeds3 driver, whose env-var mapping is fragile across versions.
# If you want S3 object storage instead, point OC_STORAGE_USERS_DRIVER at
# `decomposeds3` and supply the OC_STORAGE_USERS_DECOMPOSEDS3_* vars.

services:
  opencloud:
    <<: *service-defaults
    # 8.0.1 (2026-09): upgrade from 6.0.0 — 6.x never got the startup
    # data-race patch ("concurrent map read and map write"), 7.x fixed it.
    # If a multi-core startup race ever resurfaces, pin cpuset on the host
    # (Go derives GOMAXPROCS from affinity; the env var is ignored).
    image: opencloudeu/opencloud-rolling:8.0.1
    container_name: opensme-opencloud
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256M
    tmpfs:
      - /tmp
    # IdP backchannel: ocis validates tokens against OC_OIDC_ISSUER over
    # HTTPS. Inside the compose network the public IdP hostname resolves to
    # the Zitadel CONTAINER IP, where :443 is NOT listening (internally it
    # only serves :8080 plain HTTP; TLS lives at the edge traefik) — server-
    # side discovery/JWKS validation fails and the OIDC login never completes.
    # Docker's embedded DNS resolves the IdP hostname to the zitadel container
    # IP (172.19.0.18) where only plain-HTTP :8080 listens -> ocis's Go HTTP
    # client fails discovery with `connection refused` on :443 and every API
    # call 401s. Pin the IdP hostname to host-gateway (= the docker0 bridge,
    # 172.17.0.1) where the fleet traefik listens on :443 and serves the IdP
    # vhost by Host/SNI. NOTE ocis ignores Docker's injected http_proxy, so
    # "backchannel works" tests must use wget -Y off (busybox --no-proxy is
    # not supported and silently false-fails).
    extra_hosts:
      - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - opencloud-config:/etc/opencloud
      # NOTE: /var/lib/opencloud MUST be its own volume. Mounting
      # opencloud-config here too (as an earlier revision did) makes the
      # config dir and the runtime-state dir the same filesystem — the
      # binary writes registry/idm/web state into its config dir and dies
      # at startup (frontend revad exits 1 silently, web: "invalid app").
      - opencloud-lib:/var/lib/opencloud
      - opencloud-data:/var/lib/opencloud/data
      - ./opencloud/opencloud-entrypoint.sh:/entrypoint.sh:ro
    environment:
      OC_INSECURE: ${OC_INSECURE:-true}
      # ^ true is correct for Docker Compose — inter-service traffic
      #   stays on the internal network (no TLS). Security boundary is Traefik.
      # Proxy must serve plain HTTP on :9200 internally — otherwise the
      # healthcheck (curl http://localhost:9200/health/ready) hits a TLS
      # listener and the container reports unhealthy forever.
      PROXY_TLS: "false"
      OC_LOG_LEVEL: ${LOG_LEVEL:-info}
      OC_LOG_PRETTY: ${LOG_PRETTY:-true}
      OC_ADMIN_USERNAME: ${OC_ADMIN_USERNAME:-admin}
      OC_ADMIN_PASSWORD: ${OC_ADMIN_PASSWORD:-CHANGEME_oc_admin}
      OC_DOMAIN: ${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}
      OC_URL: https://${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}
      OC_IDP_URL: https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      OC_OIDC_ISSUER: https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      OC_OIDC_CLIENT_ID: ${OC_OIDC_CLIENT_ID:-opencloud}
      # The persistent OIDC client is registered by scripts/zitadel-client.sh
      # (idempotent, first demo boot); it writes the Zitadel-issued secret into
      # .env as OC_OIDC_CLIENT_SECRET. OC_OIDC_SECRET is kept as a legacy
      # fallback for older .env files / overlay consumers.
      OC_OIDC_CLIENT_SECRET: ${OC_OIDC_CLIENT_SECRET:-${OC_OIDC_SECRET:-CHANGEME_oidc_client}}
      PROXY_ROLE_ASSIGNMENT_DRIVER: ${OPENCLOUD_ROLE_ASSIGNMENT_DRIVER:-oidc}
      # Opt-in machine auth for automation (poll-attachment upload +
      # automated public-share creation). Validates basic-auth credentials
      # against the IDM — works alongside the Zitadel IdP. Off by default;
      # set OPENCLOUD_ENABLE_BASIC_AUTH=true when CLOUD_WEBDAV_* is used.
      # NOTE: with basic auth, role assignment must be 'default' (oidc
      # driver needs claims that basic-auth requests don't carry).
      PROXY_ENABLE_BASIC_AUTH: ${OPENCLOUD_ENABLE_BASIC_AUTH:-false}
      # Automated poll attachments create read-only public links; the
      # OpenCloud default (password required) breaks the OCS share-create.
      # Default stays 'true' (safe); set OPENCLOUD_PUBLIC_SHARE_PASSWORD=false
      # only where the poll-workflow needs passwordless read-only links.
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: ${OPENCLOUD_PUBLIC_SHARE_PASSWORD:-true}
      # Local POSIX filesystem backend (no MinIO/S3 required).
      OC_STORAGE_USERS_DRIVER: ocis
      OC_ADD_RUN_SERVICES: notifications
      # SMTP (password-reset / share notifications) — relay via Stalwart.
      # NOTE: the notifications service binds these WITHOUT the OC_ prefix
      # (struct tag env:"NOTIFICATIONS_SMTP_SENDER"), so the bare names are
      # required. Startup only validates the sender format; actual delivery
      # needs a matching Stalwart account (configure OC_SMTP_* in your .env).
      NOTIFICATIONS_SMTP_SENDER: ${OC_SMTP_SENDER:-noreply@${OPENSME_DOMAIN:-opensme.graphwiz.ai}}
      NOTIFICATIONS_SMTP_HOST: ${OC_SMTP_HOST:-stalwart}
      NOTIFICATIONS_SMTP_PORT: ${OC_SMTP_PORT:-587}
      NOTIFICATIONS_SMTP_TLS_INSECURE: ${OC_SMTP_TLS_INSECURE:-true}
      NOTIFICATIONS_SMTP_AUTHENTICATION: ${OC_SMTP_AUTHENTICATION:-login}
      NOTIFICATIONS_SMTP_USERNAME: ${OC_SMTP_USERNAME:-noreply@${OPENSME_DOMAIN:-opensme.graphwiz.ai}}
      # empty default: mail is an opt-in feature — a CHANGEME placeholder
      # would sit in the live container env of every SMTP-less deployment
      NOTIFICATIONS_SMTP_PASSWORD: ${OC_SMTP_PASSWORD:-}
      # Performance tuning
      OC_PERMISSIONS_SSH_KEY_AGE_MAX: 0
      OC_STORAGE_USERS_MAX_CONCURRENCY: 10
      OC_HTTP_CACHE_TTL: 3600
      OC_UPLOAD_MAX_SIZE: 10737418240
    user: "0:0"
    # mounted opencloud-entrypoint.sh generates config on first run,
    # then execs the opencloud binary (image ENTRYPOINT is /usr/bin/opencloud)
    entrypoint: ["/entrypoint.sh"]
    command: ["server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.opencloud.rule=Host(`${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.opencloud.tls=true"
      - "traefik.http.routers.opencloud.entrypoints=websecure"
      - "traefik.http.services.opencloud.loadbalancer.server.port=9200"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  collabora:
    # No `<<: *service-defaults`: CODE cannot run under no-new-privileges
    # (it Elevates through file capabilities at runtime). Enumerate the other
    # defaults explicitly instead.
    image: ${COLLABORA_IMAGE:-collabora/code:latest}
    container_name: opensme-collabora
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    shm_size: 512M
    environment:
      aliasgroup1: https://${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}:443
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:num_prespawn_children=4
        --o:max_connections=200
        --o:max_documents=100
      domain: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      DONT_GEN_SSL_CERT: true
      username: ${COLLABORA_USERNAME:-admin}
      password: ${COLLABORA_PASSWORD:-CHANGEME_collabora}
    cap_add:
      - MKNOD
    # collabora/code 26.04 ships NO curl, wget, or shell — an in-container
    # healthcheck is impossible, so leave the container healthcheck-less
    # ("Up"): traefik routes it immediately and a dead coolwsd shows up as
    # 502. (The old curl probe made newer image builds permanently unhealthy,
    # which made traefik v3.5+ filter the router entirely → 404.)
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.collabora.rule=Host(`${COLLABORA_DOMAIN:-collabora.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.collabora.tls=true"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

volumes:
  opencloud-config:
  opencloud-lib:
  opencloud-data:
