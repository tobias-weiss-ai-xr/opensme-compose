# openSME — Blackbox exporter configuration (blueprint)
# ------------------------------------------------------
# Monitors every component of an openSME deployment "from the outside":
# the probe always goes through the public entry point (reverse proxy),
# so a wrong router, stale container IP, dead backend or wedged daemon
# shows up as probe_success == 0 — exactly the failure class that hit
# the apex and home 502s on 2026-10-27.
#
# Adjust here: add/remove modules or tweak valid_status_codes / markers.
modules:
  # ── Tier 1: reachability / routing health ──────────────────────────
  # Any 2xx, any 3xx (redirects — e.g. login or locale jumps) and 401
  # (auth-gated) are VALID. 404/400/403/405/429 are NOT: they mean a
  # broken router / missing route / misconfigured backend.
  http_avail:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401]

  # ── Tier 2: strict 2xx (deep checks like /health must not redirect) ─
  http_200:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 201, 202, 204]

  # ── Tier 3: content check (200 + an expected marker in the body) ───
  # The marker must be unique to YOUR page (adjust below; one module per
  # marker). Use for the marketing site so a 200 empty/error page still
  # alerts.
  http_content:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      # ADJUST ME — put a stable string your site always renders, e.g.
      # the <title> or a footer slogan of the marketing page.
      fail_if_body_not_matches_regexp: ["openSME"]

  # ── Tier 4: TCP reachability (SMTP/IMAP/POP3 — Stalwart etc.) ──────
  tcp_connect:
    prober: tcp
    timeout: 5s

  # ── Tier 5: FUNCTIONAL probe — Matrix login API must advertise SSO ──
  # Not just a 200: the body must contain the m.login.sso flow AND a
  # Zitadel/OIDC identity provider. Losing the OIDC wiring makes Synapse
  # fall back to a local password form — the element "Weiter mit Zitadel"
  # button disappears while every 200-probe stays green.
  matrix_sso:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ["m.login.sso", "(?i)zitadel"]

  # ── Tier 6: FUNCTIONAL probe — SSO redirect chain (synapse -> IdP) ──
  # Follows /_matrix/client/v3/login/sso/redirect and requires the final
  # landing page to be the IdP's login UI (marker "Welcome back"). This
  # proves the whole chat-SSO hop works (Synapse OIDC provider, Zitadel
  # route, login UI) — a 200 from an empty/broken page still alerts.
  sso_redirect_to_idp:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ["Welcome back"]

  # ── Tier 7: FUNCTIONAL probe — sogo6 webmail deep health ──
  # /api/user/v1/health answers {status, version, dependencies{database,
  # ldap, redis, stalwart_mail}}. Requiring "status": "ok" catches a
  # webmail whose DB/redis/mail backend went down — a plain /en 200 probe
  # would stay green while logins fail server-side.
  webmail_health:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['"status": "ok"']

  # ── Tier 8: FUNCTIONAL protocol dialogs (not just TCP connect) ──────
  # These exchange real protocol commands with the mail daemon, so a
  # wedged listener that still accepts connections now alerts.
  tcp_smtp_ehlo:
    prober: tcp
    timeout: 8s
    tcp:
      query_response:
        - expect: "^220"          # server greeting (sent on connect)
        - send: "EHLO blackbox.opensme.monitoring\r"   # note: blackbox appends \n
        - expect: "250"           # EHLO must be answered, not just tolerated

  tcp_imap_noop:
    prober: tcp
    timeout: 8s
    tcp:
      query_response:
        - expect: "^\\* OK"      # IMAP greeting (sent on connect)
        - send: "a01 NOOP\r"
        - expect: "a01 OK"        # tagged response proves commands are served

  # ── Tier 5: ICMP (only where you are allowed to ping the host) ─────
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
