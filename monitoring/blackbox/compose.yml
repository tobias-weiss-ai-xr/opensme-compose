# openSME — standalone Blackbox monitor (blueprint)
# =================================================
# Self-contained Prometheus + Blackbox exporter for an openSME deployment.
# No dependency on the suite compose chain — only the rendered scrape config
# is needed (it embeds the resolved target URLs).
#
# Render the scrape config first (from the stack's .env or env vars):
#   python3 monitoring/blackbox/generate-scrape.py --env-file .env -o monitoring/blackbox/standalone-prometheus.yml
#
# Then run:
#   docker compose -f monitoring/blackbox/compose.yml --profile monitoring up -d
#
# Endpoints:
#   Blackbox exporter : http://127.0.0.1:9115/metrics
#   Prometheus        : http://127.0.0.1:9090
#   Alerts            : OpenSMEComponentDown / OpenSMEComponentSlow
#                       (monitoring/blackbox/prometheus-rules-opensme.yml)
services:
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: opensme-blackbox
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - opensme-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: opensme-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/blackbox/standalone-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/blackbox/prometheus-rules-opensme.yml:/etc/prometheus/rules/opensme.yml:ro
      - opensme-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - opensme-monitoring
    depends_on:
      blackbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  opensme-monitoring:
    driver: bridge

volumes:
  opensme-prometheus-data:
