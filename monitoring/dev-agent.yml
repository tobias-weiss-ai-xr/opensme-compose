# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── dev-agent overlay — Reactive container health monitor ─────
# Watches containers via Docker socket, detects unhealthy ones,
# sends context to an LLM for root-cause analysis.
#
# Include via:
#   COMPOSE_FILE="docker-compose.yml:monitoring/dev-agent.yml"
#
# Requires:
#   - Docker socket mounted (read-only)
#   - LLM backend reachable at OLLAMA_URL (or enable monitoring/ollama.yml)
#
# Endpoints:
#   :8080/healthz   Liveness probe (deployed image serves all probes on :8080)
#   :8080/metrics   Prometheus metrics
#   :8080/status    Operator status (JSON)
#   :8080/history   Analysis history (JSON)
#   :8080/cache     LLM analysis cache (JSON)

services:
  dev-agent:
    <<: *service-defaults
    image: ${DEV_AGENT_IMAGE:-ghcr.io/tobias-weiss-ai-xr/dev-agent:latest}
    # Reproducible local fallback: build from the in-repo sources when the
    # image cannot be pulled (offline / no registry access). Docker uses the
    # image name for the build tag.
    labels: ["com.centurylinklabs.watchtower.enable=false"]  # local fallback build
    build:
      context: ./monitoring/nix/dev-agent-files
    container_name: opensme-dev-agent
    restart: unless-stopped
    volumes:
      # Read-only Docker socket — agent inspects containers but cannot mutate
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent state (analysis history, cache) across restarts
      - dev-agent-state:/var/lib/opensme
      # Read-only access to compose project for container discovery
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    environment:
      OPERATOR_NAME: opensme-dev-agent
      OPERATOR_NAMESPACE: opensme
      OPERATOR_VERSION: "3.1.0"
      OPERATOR_LOG_LEVEL: ${LOG_LEVEL:-info}
      # Python observer filters by CONTAINER-NAME substring (dev_agent.py),
      # not the compose project label — the stack's containers are named
      # opensme-*, so the default must be "opensme" ("opensme-compose" is the
      # Go bot's exact-match label default and would match nothing here).
      OPERATOR_WATCH_NAMESPACES: ${DEV_AGENT_WATCH_NAMESPACES:-opensme,default}
      # LLM backend (ollama | saia | tud | openai)
      LLM_BACKEND: ${DEV_AGENT_LLM_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-30b-a3b:latest}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      SAIA_API_URL: ${SAIA_API_URL:-}
      SAIA_API_KEY: ${SAIA_API_KEY:-}
      SAIA_MODEL: ${SAIA_MODEL:-qwen3.5-35b-a3b}
      TUD_API_URL: ${TUD_API_URL:-}
      TUD_API_KEY: ${TUD_API_KEY:-}
      TUD_MODEL: ${TUD_MODEL:-GLM-5.2-AWQ-INT4}
      OPENAI_API_URL: ${OPENAI_API_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # Reconcile loop
      RECONCILE_INTERVAL: ${DEV_AGENT_RECONCILE_INTERVAL:-60}
      ANALYSIS_TTL: ${DEV_AGENT_ANALYSIS_TTL:-300}
      ANALYSIS_TTL_MAX: ${DEV_AGENT_ANALYSIS_TTL_MAX:-1200}
      MAX_PODS_PER_CYCLE: ${DEV_AGENT_MAX_PODS_PER_CYCLE:-3}
      LOG_VERBOSITY: ${LOG_LEVEL:-info}
      HISTORY_FILE: /var/lib/opensme/analysis-history.json
      HISTORY_MAX: ${DEV_AGENT_HISTORY_MAX:-100}
      # HTTP
      OPERATOR_METRICS_BIND_ADDRESS: "0.0.0.0:8080"
      OPERATOR_HEALTH_PROBE_BIND_ADDRESS: "0.0.0.0:8081"
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── dev-maintenance-bot — runbook KB + consent-gated healing ─────
  # Go one-shot bot: checks containers over a READ-ONLY docker socket,
  # matches symptoms against the embedded opensme-knowledge runbooks,
  # and remediates only with DEV_AGENT_ALLOW_HEAL=true (dry-run receipts
  # otherwise). Distinct from the `dev-agent` observer above (which only
  # watches and analyses) — this one can act, hence one-shot by default.
  # Trigger via cron/systemd/pi (`make agent-build`, `make agent-status`).
  dev-maintenance-bot:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: opensme-dev-agent/Dockerfile
    image: ${DEV_MAINTENANCE_BOT_IMAGE:-opensme-dev-maintenance-bot:latest}
    container_name: opensme-dev-maintenance-bot
    restart: "no"
    command: ["-once"]
    volumes:
      # Read-only Docker socket — the bot may inspect, never mutate
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persisted history/evidence (audit trail survives one-shot runs)
      - dev-maintenance-bot-state:/var/lib/opensme
    environment:
      DEV_AGENT_INTERVAL: ${DEV_AGENT_INTERVAL:-60s}
      DEV_AGENT_WATCH: ${DEV_AGENT_WATCH:-opensme}
      DEV_AGENT_STATE_DIR: /var/lib/opensme/bot
      DEV_AGENT_ALLOW_HEAL: ${DEV_AGENT_ALLOW_HEAL:-false}
      DEV_AGENT_API_ADDR: 0.0.0.0:8082
      DEV_AGENT_HOSTNAMES: ${DEV_AGENT_HOSTNAMES:-}
      # LLM analysis — OFF unless explicitly enabled (privacy default).
      # Bot-specific var so the stack-wide DEV_AGENT_LLM_BACKEND (python
      # dev-agent) cannot silently turn it on.
      DEV_AGENT_LLM_BACKEND: ${DEV_MAINTENANCE_BOT_LLM_BACKEND:-none}
      DEV_AGENT_LLM_URL: ${DEV_MAINTENANCE_BOT_LLM_URL:-}
      DEV_AGENT_LLM_MODEL: ${DEV_MAINTENANCE_BOT_LLM_MODEL:-}
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  dev-agent-state:
  dev-maintenance-bot-state:
