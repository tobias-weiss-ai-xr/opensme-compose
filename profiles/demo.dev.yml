# ═══════════════════════════════════════════════
# openSME — Demo / Dev Profile
# ═══════════════════════════════════════════════
# Minimal footprint for:
#   - Demo deployments (2 vCPU, 4 GB RAM, 50 GB SSD)
#   - Local development
#   - CI/CD pipelines
#
# Use: docker compose -f docker-compose.yml -f idm/zitadel.yml -f opencloud/opencloud.yml -f profiles/demo.dev.yml up -d
# ═══════════════════════════════════════════════

services:
  # ── PostgreSQL (minimal) ─────────────────────
  postgres:
    command:
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=100"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "max_wal_size=1GB"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ── Skip PgBouncer in demo/dev (direct connect) ─
  pgbouncer:
    profiles:
      - donotstart

  # ── Redis (minimal, no persistence for dev) ──
  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --save ""
      - --appendonly no
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --loglevel warning
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Memcached (minimal) ──────────────────────
  memcached:
    command: memcached -m 128 -c 1024 -t 2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Portal (dev-friendly) ────────────────────
  portal:
    environment:
      # Demo is plain HTTP on :80; keep the landing-page service links alive
      # (OPENCLOUD_URL defaults to https in docker-compose.yml).
      OPENCLOUD_URL: http://${OPENCLOUD_DOMAIN:-cloud.opensme.local}
      # Server-side OIDC legs (token/userinfo) hit the IdP's plain-HTTP
      # listener on the compose network — Traefik's self-signed demo cert
      # would fail reqwest's TLS verification on the public URL.
      IDP_INTERNAL_URL: http://zitadel:8080
    ports:
      - "127.0.0.1:8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./portal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.portal.rule=Host(`${PORTAL_DOMAIN:-home.opensme.local}`)"
      - "traefik.http.routers.portal.tls=false"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=8080"
      # TLS face for the journey contracts (https://portal.<domain>); Traefik
      # serves its self-signed default cert — no LE for .local.
      - "traefik.http.routers.portal-https.rule=Host(`${PORTAL_DOMAIN:-home.opensme.local}`)"
      - "traefik.http.routers.portal-https.entrypoints=websecure"
      - "traefik.http.routers.portal-https.tls=true"
      - "traefik.http.routers.portal-https.service=portal"
      # Beat the inherited `portal-web` router (base compose, priority 100,
      # backend :3000) on :443. The Web app (profile `web`) is NOT started in
      # the demo, so with the default rule-length priority Traefik routed
      # https://portal.<domain> onto the dead :3000 backend → 502 for every
      # plain-HTTP-to-HTTPS bounce (traefik's web entrypoint globally
      # redirects to websecure). This line restores the Rust portal as the
      # demo's TLS face; any consumer of the `web` profile is unaffected
      # because portal-web keeps priority 100 and owns the Host in that case.
      - "traefik.http.routers.portal-https.priority=200"
      # ── Rate-limit probe route (demo/e2e only) ────────────────────
      # The production limiter (ratelimit@file, avg 100 / burst 200) needs
      # >100 req/s sustained to trip. A Python flood client on a 2-core CI
      # runner cannot reliably reach that, so tests/05-e2e/rate_limit.py
      # could never trip it there even though the edge limiter works
      # (lab-proven: 1000-req flood → ~650×429 with the real portal image).
      # This dedicated host uses Traefik's OWN rateLimit middleware with a
      # demo-sized budget so the flood is deterministic on any runner. The
      # entrypoint chain (compress → ratelimit@file → hsts) is still applied
      # first — this just adds a tighter per-route budget on top. No real
      # route or live deployment is touched.
      - "traefik.http.middlewares.demo-rl.rateLimit.average=5"
      - "traefik.http.middlewares.demo-rl.rateLimit.burst=15"
      - "traefik.http.routers.portal-rlprobe.rule=Host(`rlprobe.${OPENSME_DOMAIN:-opensme.local}`)"
      - "traefik.http.routers.portal-rlprobe.entrypoints=websecure"
      - "traefik.http.routers.portal-rlprobe.tls=true"
      - "traefik.http.routers.portal-rlprobe.service=portal"
      - "traefik.http.routers.portal-rlprobe.middlewares=demo-rl@docker"

  # ── Zitadel (minimal, direct PG, no pool) ──
  zitadel:
    # Demo/.local hosts serve plain HTTP on :80; the base command forces
    # https OIDC issuer via --tlsMode external, and a mixed setup would
    # advertise https:// endpoints that Traefik cannot route. Override with
    # the FULL command (overlay semantics REPLACE the base command) plus
    # EXTERNALPORT=80 so the issuer/jwks/token URLs are plain http.
    command:
      - "start"
      - "--masterkeyFile"
      - "/secrets/masterkey"
      - "--tlsMode"
      - "disabled"
    environment:
      ZITADEL_EXTERNALPORT: "80"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.http.routers.zitadel.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.local}`)"
      - "traefik.http.routers.zitadel.tls=false"
      - "traefik.http.routers.zitadel.entrypoints=web"
      - "traefik.http.services.zitadel.loadbalancer.server.port=8080"
      - "traefik.http.routers.zitadel-https.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.local}`)"
      - "traefik.http.routers.zitadel-https.entrypoints=websecure"
      - "traefik.http.routers.zitadel-https.tls=true"
      - "traefik.http.routers.zitadel-https.service=zitadel"

  # ── OpenCloud (minimal, local storage, no antivirus) ─
  opencloud:
    environment:
      # Serve all internal URLs over https in the demo — the demo edge now
      # has a working :443 (opencloud-https router), so OC_URL must use the
      # https scheme. With http:// here, ocis's proxy answered / with 404
      # (scheme mismatch between the request and the configured proxy URL),
      # which is what broke the opencloud web UI + catalog tile in CI e2e.
      # OIDC issuer stays https (OpenCloud refuses plain-http issuers).
      OC_URL: https://${OPENCLOUD_DOMAIN:-cloud.opensme.local}
      # Fresh demo boots (no persisted config volume) hit a metadata-prefix
      # mismatch: storage-users (ocis driver -> user.ocis.) vs storage-system
      # (default -> user.oc.) crash the server. Pin the prefix so a fresh
      # init stays consistent. Live keeps its persisted config and is
      # unaffected (this is demo-only).
      OC_METADATA_PREFIX: user.ocis.
      # The notifications service (OC_ADD_RUN_SERVICES=notifications) validates
      # its smtp_sender at startup; an unset/empty value is fatal and takes
      # the whole server down. Live sets these via .env; the demo generates
      # .env without them, so provide sane defaults here.
      NOTIFICATIONS_SMTP_SENDER: noreply@opensme.local
      NOTIFICATIONS_SMTP_HOST: localhost
      NOTIFICATIONS_SMTP_PORT: "25"
      NOTIFICATIONS_SMTP_AUTHENTICATION: none
      NOTIFICATIONS_SMTP_TLS_INSECURE: "true"
      OC_ADD_RUN_SERVICES: "notifications"
      STORAGE_USERS_DRIVER: ocis
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.http.routers.opencloud.rule=Host(`${OPENCLOUD_DOMAIN:-cloud.opensme.local}`)"
      - "traefik.http.routers.opencloud.tls=false"
      - "traefik.http.routers.opencloud.entrypoints=web"
      - "traefik.http.services.opencloud.loadbalancer.server.port=9200"
      - "traefik.http.routers.opencloud-https.rule=Host(`${OPENCLOUD_DOMAIN:-cloud.opensme.local}`)"
      - "traefik.http.routers.opencloud-https.entrypoints=websecure"
      - "traefik.http.routers.opencloud-https.tls=true"
      - "traefik.http.routers.opencloud-https.service=opencloud"
      # OpenCloud's proxy middleware redirects (308) any request whose
      # X-Forwarded-Proto is http to https (proxy/pkg/middleware/https_redirect);
      # there is no env to disable it. Upstream's external-proxy docs set
      # X-Forwarded-Proto: https explicitly; mirror that per-router so the
      # http-only demo works. Only the opencloud router is affected.
      - "traefik.http.routers.opencloud.middlewares=oc-https@docker,hsts@file"
      - "traefik.http.middlewares.oc-https.headers.customrequestheaders.X-Forwarded-Proto=https"

  # ── Collabora (skip for demo/dev - too heavy) ─
  collabora:
    profiles:
      - donotstart

  # ── Stalwart (skip for demo/dev) ─────────────
  stalwart:
    profiles:
      - donotstart

  # ── Traefik (HTTP-only for .local demo domains) ─
  # The traefik command deliberately has NO override here: compose merges
  # `command:` by REPLACEMENT, so any copy here silently drops whatever the
  # base later grows — that is exactly how the internal-only idpplain
  # entrypoint (Stalwart's OIDC userinfo path) vanished from every
  # demo.sh-booted stack and turned the CI mail journey red with bare 454s.
  # docker-compose.yml stays the single source of truth for the edge.
  traefik: {}

  # ── SOGo (skip for demo/dev) ─────────────────
  sogo:
    profiles:
      - donotstart
