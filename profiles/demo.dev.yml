# ═══════════════════════════════════════════════
# openSME — Demo / Dev Profile
# ═══════════════════════════════════════════════
# Minimal footprint for:
#   - Demo deployments (2 vCPU, 4 GB RAM, 50 GB SSD)
#   - Local development
#   - CI/CD pipelines
#
# Use: docker compose -f docker-compose.yml -f idm/zitadel.yml -f opencloud/opencloud.yml -f profiles/demo.dev.yml up -d
# ═══════════════════════════════════════════════

services:
  # ── PostgreSQL (minimal) ─────────────────────
  postgres:
    command:
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=100"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "max_wal_size=1GB"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ── Skip PgBouncer in demo/dev (direct connect) ─
  pgbouncer:
    profiles:
      - donotstart

  # ── Redis (minimal, no persistence for dev) ──
  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --save ""
      - --appendonly no
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --loglevel warning
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Memcached (minimal) ──────────────────────
  memcached:
    command: memcached -m 128 -c 1024 -t 2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Portal (dev-friendly) ────────────────────
  portal:
    environment:
      # Demo is plain HTTP on :80; keep the landing-page service links alive
      # (OPENCLOUD_URL defaults to https in docker-compose.yml).
      OPENCLOUD_URL: http://${OPENCLOUD_DOMAIN:-cloud.opensme.local}
      # Server-side OIDC legs (token/userinfo) hit the IdP's plain-HTTP
      # listener on the compose network — Traefik's self-signed demo cert
      # would fail reqwest's TLS verification on the public URL.
      IDP_INTERNAL_URL: http://zitadel:8080
    ports:
      - "127.0.0.1:8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./portal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.portal.rule=Host(`${PORTAL_DOMAIN:-home.opensme.local}`)"
      - "traefik.http.routers.portal.tls=false"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=8080"
      # TLS face for the journey contracts (https://portal.<domain>); Traefik
      # serves its self-signed default cert — no LE for .local.
      - "traefik.http.routers.portal-https.rule=Host(`${PORTAL_DOMAIN:-home.opensme.local}`)"
      - "traefik.http.routers.portal-https.entrypoints=websecure"
      - "traefik.http.routers.portal-https.tls=true"
      - "traefik.http.routers.portal-https.service=portal"

  # ── Zitadel (minimal, direct PG, no pool) ──
  zitadel:
    # Demo/.local hosts serve plain HTTP on :80; the base command forces
    # https OIDC issuer via --tlsMode external, and a mixed setup would
    # advertise https:// endpoints that Traefik cannot route. Override with
    # the FULL command (overlay semantics REPLACE the base command) plus
    # EXTERNALPORT=80 so the issuer/jwks/token URLs are plain http.
    command:
      - "start"
      - "--masterkeyFile"
      - "/secrets/masterkey"
      - "--tlsMode"
      - "disabled"
    environment:
      ZITADEL_EXTERNALPORT: "80"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.http.routers.zitadel.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.local}`)"
      - "traefik.http.routers.zitadel.tls=false"
      - "traefik.http.routers.zitadel.entrypoints=web"
      - "traefik.http.services.zitadel.loadbalancer.server.port=8080"
      - "traefik.http.routers.zitadel-https.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.local}`)"
      - "traefik.http.routers.zitadel-https.entrypoints=websecure"
      - "traefik.http.routers.zitadel-https.tls=true"
      - "traefik.http.routers.zitadel-https.service=zitadel"

  # ── OpenCloud (minimal, local storage, no antivirus) ─
  opencloud:
    environment:
      # Serve all internal URLs over http in demo; OIDC issuer stays https
      # (OC_OIDC_ISSUER, OpenCloud refuses plain-http issuers) — the demo
      # Traefik routes only :80, so https OC_URL bounces the UI to a dead
      # :443.
      OC_URL: http://${OPENCLOUD_DOMAIN:-cloud.opensme.local}
      OC_ADD_RUN_SERVICES: "notifications"
      STORAGE_USERS_DRIVER: ocis
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.http.routers.opencloud.rule=Host(`${OPENCLOUD_DOMAIN:-cloud.opensme.local}`)"
      - "traefik.http.routers.opencloud.tls=false"
      - "traefik.http.routers.opencloud.entrypoints=web"
      - "traefik.http.services.opencloud.loadbalancer.server.port=9200"
      - "traefik.http.routers.opencloud-https.rule=Host(`${OPENCLOUD_DOMAIN:-cloud.opensme.local}`)"
      - "traefik.http.routers.opencloud-https.entrypoints=websecure"
      - "traefik.http.routers.opencloud-https.tls=true"
      - "traefik.http.routers.opencloud-https.service=opencloud"
      # OpenCloud's proxy middleware redirects (308) any request whose
      # X-Forwarded-Proto is http to https (proxy/pkg/middleware/https_redirect);
      # there is no env to disable it. Upstream's external-proxy docs set
      # X-Forwarded-Proto: https explicitly; mirror that per-router so the
      # http-only demo works. Only the opencloud router is affected.
      - "traefik.http.routers.opencloud.middlewares=oc-https@docker"
      - "traefik.http.middlewares.oc-https.headers.customrequestheaders.X-Forwarded-Proto=https"

  # ── Collabora (skip for demo/dev - too heavy) ─
  collabora:
    profiles:
      - donotstart

  # ── Stalwart (skip for demo/dev) ─────────────
  stalwart:
    profiles:
      - donotstart

  # ── Traefik (HTTP-only for .local demo domains) ─
  # The traefik command deliberately has NO override here: compose merges
  # `command:` by REPLACEMENT, so any copy here silently drops whatever the
  # base later grows — that is exactly how the internal-only idpplain
  # entrypoint (Stalwart's OIDC userinfo path) vanished from every
  # demo.sh-booted stack and turned the CI mail journey red with bare 454s.
  # docker-compose.yml stays the single source of truth for the edge.
  traefik: {}

  # ── SOGo (skip for demo/dev) ─────────────────
  sogo:
    profiles:
      - donotstart
