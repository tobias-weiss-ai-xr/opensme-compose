# ═══════════════════════════════════════════════════════════════
# openSME — Small Tier (10-25 users, 8c/24G)
# ═══════════════════════════════════════════════════════════════
# Balanced resource profile for team SMEs.
# Core + OpenCloud + Paperless (+ optional Tika for enhanced OCR).
# Skips: Collabora (OpenCloud handles basic editing), Stalwart, SOGo.
#
# Use: COMPOSE_FILE="docker-compose.yml:idm/zitadel.yml:opencloud/opencloud.yml:services/paperless.yml:profiles/small.yml"
# ═══════════════════════════════════════════════════════════════

services:
  postgres:
    command:
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "bgwriter_lru_maxpages=100"
      - "-c"
      - "autovacuum_work_mem=128MB"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M

  pgbouncer:
    environment:
      PGBOUNCER_DEFAULT_POOL_SIZE: 15
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_MAX_DB_CONNECTIONS: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --save 300 100
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 1gb
      - --maxmemory-policy allkeys-lru
      - --lazyfree-lazy-eviction yes
      - --lazyfree-lazy-expire yes
      - --loglevel notice
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 768M

  memcached:
    command: memcached -m 384 -c 2048 -t 4
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  portal:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  zitadel:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  opencloud:
    environment:
      OC_ADD_RUN_SERVICES: "notifications"
      STORAGE_USERS_DRIVER: decomposeds3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  collabora:
    profiles:
      - donotstart

  stalwart:
    profiles:
      - donotstart

  sogo:
    profiles:
      - donotstart
