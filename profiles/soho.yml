# ═══════════════════════════════════════════════════════════════
# openSME — SOHO Tier (1-5 users, 4c/8G)
# ═══════════════════════════════════════════════════════════════
# Minimal resource profile for solo/small SME.
# Core only: Portal, Traefik, PostgreSQL, Redis, Memcached, Zitadel.
# Skips: PgBouncer, Collabora, Stalwart, SOGo, OpenCloud.
#
# Use: COMPOSE_FILE="docker-compose.yml:idm/zitadel.yml:profiles/soho.yml"
# ═══════════════════════════════════════════════════════════════

services:
  postgres:
    command:
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=100"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "bgwriter_lru_maxpages=100"
      - "-c"
      - "autovacuum_work_mem=64MB"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  pgbouncer:
    profiles:
      - donotstart

  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --save ""
      - --appendonly no
      - --maxmemory 128mb
      - --maxmemory-policy allkeys-lru
      - --lazyfree-lazy-eviction yes
      - --lazyfree-lazy-expire yes
      - --loglevel warning
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.1"
          memory: 96M

  memcached:
    command: memcached -m 96 -c 1024 -t 2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  portal:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  zitadel:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  opencloud:
    profiles:
      - donotstart

  collabora:
    profiles:
      - donotstart

  stalwart:
    profiles:
      - donotstart

  sogo:
    profiles:
      - donotstart
