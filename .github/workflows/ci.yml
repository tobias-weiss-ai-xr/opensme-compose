name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality (fmt + lint + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Rust (portal) ────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo builds
        # SHA-pinned Swatinem/rust-cache v2 — cold CI runners otherwise
        # recompile the full test profile (axum + reqwest + proptest + tower)
        # from scratch, which can exceed the job timeout under contention.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: portal
      - name: cargo fmt --check (portal)
        run: cargo fmt --check
        working-directory: portal
      - name: cargo clippy -D warnings (portal)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: portal
      - name: cargo test (portal)
        run: cargo test
        working-directory: portal

      # ── Go (dev-agent) ───────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt (fail on drift)
        run: |
          drift=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$drift" ]; then echo "::error::unformatted Go files: $drift"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

      # ── Shell (scripts) ──────────────────────────────────
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck (all tracked .sh)
        # Defense-in-depth: shellcheck EVERY tracked .sh (git ls-files), not
        # just scripts/*.sh — 13 tracked scripts outside scripts/ were never
        # checked (e.g. bootstrap/scripts, mail/*-entrypoint.sh). -S warning
        # makes ANY warning fail the build (plain shellcheck defaults to
        # severity=style and exits 0 on warnings only).
        run: |
          set -u
          FAIL=0
          while IFS= read -r -d '' f; do
            # Vendored/third-party trees are deliberately excluded:
            #  - mail/mailcow-dockerized   (upstream submodule)
            #  - monitoring/nix/taskfleet-files (vendored taskfleet lib)
            case "$f" in
              */mailcow-dockerized/*|*/taskfleet-files/*) continue ;;
            esac
            echo "shellcheck $f"
            shellcheck -S warning "$f" || FAIL=1
          done < <(git ls-files -z '*.sh')
          exit $FAIL

  static:
    name: Static validation + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Full static suite (Layers 0-2)
        # YAML lint, .env completeness, secret scan, spec compliance,
        # contract validation. No running stack required. Single entry
        # point: tests/run.py --static owns the layer-0 list (incl. the
        # secret scan), so CI must not call tests/00-static/*.py directly.
        run: python3 tests/run.py --static

  leak-scan:
    name: Generic internal-ref scan (defense in depth)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan working tree for private-network refs
        # Defense-in-depth layer: catches private-network IPs and host
        # filesystem paths in ANY tracked file (including .md, which the
        # secret scanner also now covers). Deliberately uses NO named internal
        # hostnames so this file can never re-leak them.
        shell: bash
        run: |
          set -u
          FAIL=0
          while IFS= read -r -d '' f; do
            # Documented non-leaks, verified by hand:
            #  - vendored dependency tests (node_modules) contain upstream
            #    unit-test fixtures with private-range IPv4 literals
            #  - *_test.go / *_test.py canary fixtures deliberately embed
            #    private IPs and fake secrets to test the redactor
            case "$f" in
              */node_modules/*|*_test.go|*_test.py) continue ;;
            esac
            # RFC1918 10/8 — full dotted-quad only (avoids numeric literals)
            if grep -E '\b10\.([0-9]{1,3}\.){2}[0-9]{1,3}\b' "$f" 2>/dev/null; then
              echo "::error::RFC1918 10/8 IP in $f"; FAIL=1
            fi
            # RFC1918 192.168/16, 172.16-31/12, link-local 169.254/16
            if grep -E '\b192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.' "$f" 2>/dev/null; then
              echo "::error::private/link-local IPv4 in $f"; FAIL=1
            fi
            # Host filesystem paths (require a component after the username so
            # container home dirs like /home/opensme are not flagged).
            # /srv/etc is the SOGo container's config dir on its volume, not
            # a host path (mail/sogo/sogo-entrypoint.sh).
            if grep -E '(/home|/Users|/srv)/[a-zA-Z0-9_.-]+/' "$f" 2>/dev/null \
              | grep -v '/srv/etc/' 2>/dev/null \
              | grep -q .; then
              echo "::error::host filesystem path in $f"; FAIL=1
            fi
          done < <(git ls-files -z)
          exit $FAIL

  e2e:
    name: E2E — SSO flows (demo stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Heavy job: builds the portal (rust) and boots the demo stack.
    # NOTE: This job launches containers from Docker Hub. Without repo
    # secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN set, it may hit
    # unauthenticated rate limits.
    # To stabilize E2E, either:
    #  1. Add DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets, or
    #  2. Run on a self-hosted runner with authenticated Docker.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo builds
        # SHA-pinned Swatinem/rust-cache v2 — the e2e job rebuilds the portal
        # image; cache keeps the cold docker build layer warm.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: portal

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Provision deploy-time Zitadel artifacts (masterkey + busybox)
        # Both are gitignored and normally created by the ansible deploy role.
        # Use host-provided busybox (via apt) to avoid Docker Hub rate limits
        # in GitHub Actions. busybox-static is REQUIRED: the healthcheck runs
        # inside the distroless Zitadel image which has no dynamic loader, so
        # a dynamically linked binary fails exec with ENOENT and the container
        # is marked unhealthy (Traefik then skips it -> IdP 404).
        run: |
          printf '%s' "$(openssl rand -base64 24)" > idm/secrets/masterkey
          mkdir -p idm/zitadel
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static
          cp "$(which busybox)" idm/zitadel/busybox
          chmod +x idm/zitadel/busybox
          file idm/zitadel/busybox
          file idm/zitadel/busybox | grep -q static || { echo "::error::busybox is not static - cannot run in the distroless healthcheck"; exit 1; }

      - name: Log in to Docker Hub (if token provided)
        # Docker Hub unauthenticated pull rate limiting is the most common
        # cause of flaky E2E runs. When DOCKERHUB_TOKEN is set (repo secret),
        # authenticating raises the quota substantially. Continue on error
        # in case secrets are not configured.
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not configured — Docker Hub pulls will use the unauthenticated (lower) rate limit"
          fi

      - name: Boot demo stack (generates .env with random passwords)
        run: bash scripts/demo.sh

      - name: Wait for IdP and Portal
        # Dev mode uses plain HTTP on port 80 (LE cannot issue certs for .local).
        # If the IdP is not reachable we collect diagnostics and STILL let the
        # suite run — run.py's per-endpoint status codes pinpoint the break.
        run: |
          set +e
          # -L -k: the edge redirects http→https (self-signed demo cert); -f only
          # succeeds on a final 200, so a redirect alone can never fake readiness.
          timeout 300 bash -c 'until curl -sfkL --resolve auth.opensme.local:80:127.0.0.1 --resolve auth.opensme.local:443:127.0.0.1 \
            http://auth.opensme.local/debug/ready >/dev/null 2>&1; do sleep 5; done'
          rc=$?
          echo "idp wait rc=$rc"
          if [ $rc -ne 0 ]; then
            echo "::group::idp diagnostics (wait failed)"
            docker compose -f docker-compose.yml -f idm/zitadel.yml -f opencloud/opencloud.yml -f profiles/demo.dev.yml --profile standalone ps
            echo "--- zitadel health (docker) ---"
            docker inspect --format '{{json .State.Health}}' opensme-zitadel || true
            echo "--- in-container probes (ipv4 vs ipv6 loopback) ---"
            docker exec opensme-zitadel /busybox/sh -c 'wget -q -O - http://127.0.0.1:8080/debug/ready; echo v4_rc=$?; wget -q -O - "http://[::1]:8080/debug/ready"; echo v6_rc=$?' || true
            echo "--- direct backend probe (container->container) ---"
            docker run --rm --network opensme-net busybox wget -q -O- http://zitadel:8080/debug/ready || echo "direct backend probe FAIL"
            echo "--- through traefik (status) ---"
            curl -s -o /dev/null -w 'auth/ready via traefik: %{http_code}\n' \
              --resolve auth.opensme.local:80:127.0.0.1 http://auth.opensme.local/debug/ready
            curl -s -o /dev/null -w 'auth/openid-configuration via traefik: %{http_code}\n' \
              --resolve auth.opensme.local:80:127.0.0.1 http://auth.opensme.local/.well-known/openid-configuration
            echo "::endgroup::"
          fi
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 5; done'

      - name: Run e2e suite (Layer 5 — SSO flows)
        # Pass --insecure to allow HTTP-only dev endpoints
        run: python3 tests/05-e2e/run.py --insecure opensme.local
      - name: Run portal logout journey (LO-1 single sign-out reaches OpenCloud)
        # Same IdP session machinery as run.py's section_logout, driven from the
        # portal's own POST /api/logout: cookie cleared, 303 to end-session with
        # id_token_hint, IdP session dead on replay, OpenCloud app signed out.
        run: python3 tests/05-e2e/logout.py opensme.local
      - name: Run session lifecycle journey (timeout, refresh, cross-service SSO)
        # S1 token bounds agree end to end, S2 offline_access refresh rotates
        # without re-login, S3 one IdP session covers portal + OpenCloud.
        run: python3 tests/05-e2e/session_lifecycle.py opensme.local
      - name: Run saga navigation smoke (no tile to nowhere)
        # Every tile the portal renders must lead to a URL that answers, and
        # /api/feeds degrades to empty columns instead of erroring. The full
        # saga blueprints need overlays the demo stack does not ship — they run
        # via `make saga` against a full stack.
        run: python3 tests/05-e2e/saga_smoke.py opensme.local
      - name: Run operator broadcast journey (publish → escape check → withdraw)
        run: python3 tests/05-e2e/broadcast.py opensme.local
      - name: Run resilience journey (DB bounce + IdP outage → self-heal)
        run: python3 tests/05-e2e/resilience.py opensme.local
      - name: Run backup journey (provable restore points)
        run: python3 tests/05-e2e/backup.py
      - name: Run exposure journey (management planes stay closed)
        run: python3 tests/05-e2e/exposure.py opensme.local
      - name: Run runtime truth journey (no drift, no :latest)
        run: python3 tests/05-e2e/runtime_truth.py
      - name: Run local AI journey (mock backend, contract proof)
        run: python3 tests/05-e2e/ai_journey.py opensme.local
      - name: Run agent saga AS1 (krank → diagnose → consent → heal → audit)
        # Isolated: builds the bot image if absent, drives its private REST
        # API via docker exec against self-created opensme-saga-* containers.
        run: python3 tests/05-e2e/agent_saga.py
      - name: "Run agent draft saga (AS2/AS3/AS5 write gate: draft -> approve -> commit)"
        # Isolated: proves the generic agent write gate (drafts inert until a
        # human approves; audit at each stage) against its own bot container.
        run: python3 tests/05-e2e/agent_draft_saga.py
      - name: "Run agent injection saga (AE2 prompt-injection: no commit from hostile input)"
        # Isolated: proves injection payloads fed to the dev-agent NEVER result
        # in committed drafts or injected strings in evidence beyond sanitised form.
        run: python3 tests/05-e2e/agent_injection.py
      - name: Run burst journey (concurrent load, zero 5xx)
        run: python3 tests/05-e2e/burst.py opensme.local
      - name: Run hygiene journey (no default creds, no open writes)
        run: python3 tests/05-e2e/hygiene.py opensme.local
      - name: Run transport journey (redirects, security headers, no leaks)
        run: python3 tests/05-e2e/transport.py opensme.local
      - name: Run accessibility journey (SSR document hygiene)
        run: python3 tests/05-e2e/accessibility.py opensme.local
      - name: Run rate limit journey (the edge limiter actually limits)
        run: python3 tests/05-e2e/rate_limit.py opensme.local
      - name: Run tls contract journey (legacy TLS refused, HSTS, cert window)
        run: python3 tests/05-e2e/tls_contract.py opensme.local
      - name: Run secret surface journey (least privilege on secrets)
        run: python3 tests/05-e2e/secret_surface.py opensme.local
      - name: Run observability journey (healthchecks + secrets-out-of-logs)
        run: python3 tests/05-e2e/observability.py opensme.local
      - name: Run portability journey (portal migrates to another domain)
        run: python3 tests/05-e2e/portability.py opensme.local
      - name: Run intercom journey (notes + cloud attachments, SSRF guard)
        run: python3 tests/05-e2e/intercom.py opensme.local
      - name: Run hostile input journey (nothing breaks out of the renderer)
        run: python3 tests/05-e2e/hostile_input.py opensme.local
      - name: Run concurrent writers journey (the intercom store under contention)
        run: python3 tests/05-e2e/concurrent_writers.py opensme.local
      - name: Run rolling recreate journey (deploy without turbulence)
        run: python3 tests/05-e2e/rolling_recreate.py opensme.local
      - name: Run idempotency journey (second boot converges, no duplicates)
        run: python3 tests/05-e2e/idempotency.py opensme.local
      - name: Run persistence journey (state survives full restart)
        run: python3 tests/05-e2e/persistence.py opensme.local
      - name: Run restore drill (backup → destroy → restore → verify)
        run: python3 tests/05-e2e/restore_drill.py opensme.local

  mail:
    name: E2E — mail profile (Stalwart + SOGo webmail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The demo stack boots no mail service on purpose (scripts/demo.sh skips
    # Stalwart and SOGo: too heavy for a two-minute evaluation), which left the
    # webmail page contract with no CI coverage at all. This job pays for the
    # mail profile — Stalwart + SOGo on top of the demo stack — so the overlay
    # keeps booting and SOGo keeps serving its own assets.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Provision deploy-time Zitadel artifacts (masterkey + busybox)
        run: |
          printf '%s' "$(openssl rand -base64 24)" > idm/secrets/masterkey
          mkdir -p idm/zitadel
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static
          cp "$(which busybox)" idm/zitadel/busybox
          chmod +x idm/zitadel/busybox
          file idm/zitadel/busybox | grep -q static || { echo "::error::busybox is not static"; exit 1; }

      - name: Boot demo stack (generates .env with random passwords)
        run: bash scripts/demo.sh

      - name: Boot the mail profile (Stalwart + SOGo)
        env:
          MAIL_DOMAIN: mail.opensme.local
          SOGO_DOMAIN: webmail.opensme.local
        run: |
          docker compose \
            -f docker-compose.yml -f idm/zitadel.yml \
            -f opencloud/opencloud.yml -f profiles/demo.dev.yml \
            -f mail/stalwart.yml -f mail/sogo.yml \
            --profile standalone up -d stalwart sogo

      - name: Wait for Stalwart and SOGo to report healthy
        # stalwart must bind its listeners before SOGo's depends_on can be
        # satisfied; SOGo then needs a moment for sogod + apache2. Print the
        # entrypoint's bind decision on failure — a silent no-bind (IPv6-less
        # host) is the failure mode that costs an hour to find otherwise.
        run: |
          for svc in opensme-stalwart opensme-sogo; do
            for i in $(seq 1 60); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo missing)
              [ "$st" = healthy ] && echo "$svc healthy" && break
              if [ "$st" = unhealthy ]; then
                echo "::error::$svc is unhealthy"; docker logs --tail 40 "$svc"; exit 1
              fi
              sleep 5
            done
            [ "$st" = healthy ] || { echo "::error::$svc never became healthy"; docker logs --tail 40 "$svc"; exit 1; }
          done

      - name: Run webmail page contract (login markup + every referenced asset)
        run: python3 tests/05-e2e/webmail.py opensme.local

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml -f idm/zitadel.yml \
            -f opencloud/opencloud.yml -f profiles/demo.dev.yml \
            -f mail/stalwart.yml -f mail/sogo.yml \
            --profile standalone down -v || true
