# Dependabot — keeps the public repo's dependencies current.
# docker: service images (compose uses ${X_IMAGE:-image:tag} indirection, so
#         updates land in the compose files' default references)
# github-actions: workflow actions (checkout, setup-python, ...)
# pip: tests/requirements.txt (requests, PyYAML, ...)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    # docker updater does NOT recurse from "/" — every run failed with
    # "No Dockerfiles nor Kubernetes YAML found in /". Use a recursive glob
    # over the tracked service dirs (Dockerfiles live in portal/, services/*,
    # opensme-dev-agent/, monitoring/nix/dev-agent-files/).
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
