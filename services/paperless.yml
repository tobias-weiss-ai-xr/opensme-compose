# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Paperless-ngx + Gotenberg
# ═══════════════════════════════════════════════════════════════
# Document management with OCR. Gotenberg handles PDF conversion.
# Include via: COMPOSE_FILE=docker-compose.yml:services/paperless.yml
# Or via profile: docker compose --profile paperless up -d
#
# Requires: PostgreSQL (core), Redis (core)
# Optional: Paperless-Tika for enhanced OCR (profile: tika)
# ═══════════════════════════════════════════════════════════════

services:
  paperless-ngx:
    <<: *service-defaults
    # Patched image (images/paperless-oidc) — enables the allauth generic OIDC
    # provider app; stock paperless-ngx never loads it (allauth ≥65 providers
    # come from INSTALLED_APPS). Override for upstream/own builds.
    image: ${PAPERLESS_NGX_IMAGE:-opensme/paperless-ngx:3.3.4-oidc}
    container_name: opensme-paperless
    restart: unless-stopped
    # s6-overlay must be PID 1; the shared anchor's `init: true` (tini) breaks it
    init: false
    profiles: ["paperless"]
    stop_grace_period: 60s
    tmpfs:
      - /tmp
    environment:
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/2
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless_db
      PAPERLESS_DBUSER: paperless_user
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?PAPERLESS_DB_PASSWORD must be set in .env}
      PAPERLESS_URL: https://paperless.${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      # ── SSO via the central IdP (optional — register the client with
      #    scripts/zitadel-client.sh --app paperless; issuer defaults to the
      #    auth.<domain> discovery URL) ──
      # django-allauth generic OIDC provider (allauth slug 'oidc'): the
      # browser callback is /accounts/oidc/zitadel/login/callback/. PKCE is
      # required by Zitadel; fetch_userinfo maps the identity claims.
      # NOTE the provider app is enabled by the custom image (images/paperless-oidc),
      # NOT by env — the stock image ignores any "PAPERLESS_APPS"-style hint.
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      # SSO-created users land in this group automatically (paperless ≥2.5
      # adapter). The group itself + permission set + backfill of pre-
      # existing users are provisioned idempotently by
      # scripts/provision-paperless-perms.sh — without it fresh SSO users
      # have zero permissions and every API call 403s.
      PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS: "oidc-users"
      PAPERLESS_LOGOUT_REDIRECT_URL: ${PAPERLESS_OIDC_LOGOUT_URL:-}
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: "{\"openid_connect\":{\"OAUTH_PKCE_ENABLED\":true,\"APPS\":[{\"provider_id\":\"zitadel\",\"name\":\"openSME SSO\",\"client_id\":\"${PAPERLESS_OIDC_CLIENT_ID:-}\",\"secret\":\"${PAPERLESS_OIDC_CLIENT_SECRET:-}\",\"settings\":{\"server_url\":\"https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}/.well-known/openid-configuration\",\"fetch_userinfo\":true}}],\"SCOPE\":[\"openid\",\"profile\",\"email\"]}}"
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY must be set in .env}
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Berlin}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_MODE: redo
      PAPERLESS_OCR_CLEAN: clean
      PAPERLESS_THREADS: "1"
      PAPERLESS_WEBSERVER_WORKERS: "1"
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_CONSUMER_POLLING: "30"
      PAPERLESS_FILENAME_FORMAT: "{created_year}/{created_month}/{created_day}/{correspondent}/{title}"
      PAPERLESS_CONVERT_MEMORY_LIMIT: 256
      PAPERLESS_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      # ── S3 storage backend for documents ──
      # Configure S3-compatible storage (SeaweedFS, aliased as minio) for
      # document storage. Uses the same credentials as other services via
      # OC_S3_* environment variables. This allows Paperless to store
      # documents in the shared object storage backend.
      PAPERLESS_FILES_BACKEND: s3
      PAPERLESS_AWS_ENDPOINT_URL: http://minio:9000
      PAPERLESS_AWS_ACCESS_KEY_ID: ${OC_S3_ACCESS_KEY:-minio}
      PAPERLESS_AWS_SECRET_ACCESS_KEY: ${OC_S3_SECRET_KEY:?OC_S3_SECRET_KEY must be set}
      PAPERLESS_AWS_STORAGE_BUCKET_NAME: paperless
      PAPERLESS_AWS_REGION: us-east-1
      PAPERLESS_AWS_USE_PATH_STYLE_ENDPOINT: true
      # Bypass the corporate HTTP proxy for internal Docker traffic (OIDC
      # discovery/token exchange to Zitadel via the host-gateway FQDN,
      # Gotenberg conversions). Docker's injected http_proxy cannot resolve
      # these hosts — without the bypass the SSO entry renders but the login
      # dies right after the button click (discovery 000/503 through the
      # proxy). Same pattern as SOGO_NO_PROXY in mail/sogo.yml.
      NO_PROXY: ${PAPERLESS_NO_PROXY:-localhost,127.0.0.1,opencloud,minio,seaweedfs,172.19.0.17,.opensme.local,.opensme.graphwiz.ai,paperless-gotenberg}
      no_proxy: ${PAPERLESS_NO_PROXY:-localhost,127.0.0.1,opencloud,minio,seaweedfs,172.19.0.17,.opensme.local,.opensme.graphwiz.ai,paperless-gotenberg}
      # TLS trust for the OIDC backchannel (discovery/token/userinfo against
      # https://auth.<domain> via host-gateway -> traefik): the lab wildcard
      # is baked into the image's SYSTEM bundle (images/paperless-oidc:
      # COPY + update-ca-certificates) — requests then trusts lab AND public
      # CAs; no REQUESTS_CA_BUNDLE override (that would REPLACE the bundle
      # and break ACME/Let's-Encrypt deployments).
      # Uncomment to enable Tika (requires --profile tika)
      # PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - ./services/paperless-consume:/consume:ro
    networks:
      opensme-net:
        aliases:
          - paperless-gotenberg
          - paperless-tika
          - opensme-gotenberg
          - opensme-tika
    # OIDC backchannel: docker DNS maps ${ZITADEL_DOMAIN} to the zitadel
    # container (hostname trick) where only :8080/http listens -> issuer
    # discovery on https:443 fails from inside during login. Route the FQDN
    # to the compose gateway instead: traefik (host network, :443) terminates
    # TLS and routes by Host header back to zitadel (same pattern as
    # camunda/opencloud).
    extra_hosts:
      - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.paperless.tls=true"
      - "traefik.http.routers.paperless.tls.certresolver=letsencrypt"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          # 384M OOM-killed the container at startup: granian + celery worker
          # + beat + OCR tooling all spawn before usage settles. 768M holds.
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  paperless-gotenberg:
    <<: *service-defaults
    image: gotenberg/gotenberg:latest
    container_name: opensme-gotenberg
    restart: unless-stopped
    profiles: ["paperless"]
    tmpfs:
      - /tmp
    command:
      - "gotenberg"
    network_mode: service:paperless-ngx
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M
        reservations:
          cpus: "0.05"
          memory: 16M

  paperless-tika:
    <<: *service-defaults
    image: ${TIKA_IMAGE:-apache/tika:latest}
    container_name: opensme-tika
    restart: unless-stopped
    profiles: ["tika"]
    shm_size: 256M
    tmpfs:
      - /tmp
    environment:
      TIKA_MEMORY_LIMIT: 512m
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
    network_mode: service:paperless-ngx
    healthcheck:
      # apache/tika:latest dropped curl/wget (java-only image) — probe the
      # HTTP port with bash's /dev/tcp instead.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998 && printf 'GET /tika HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q ' 200' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
