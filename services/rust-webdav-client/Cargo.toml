[package]
name = "opensme-webdav"
version = "0.1.0"
edition = "2021"
description = "Shared WebDAV client library for openSME Rust services"
license = "AGPL-3.0-only"
readme = "README.md"

[dependencies]
# HTTP client with JSON support
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multipart form data for file uploads
multipart = { version = "0.18", features = ["client"] }
# Date/time handling for WebDAV headers
chrono = { version = "0.4", features = ["serde"] }
# Error handling
thiserror = "1"
# URL parsing
url = "2"
# Percent encoding for path construction
percent-encoding = "2"
# Async trait support
async-trait = "0.1"
# Base64 encoding for Basic auth
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
mockito = "1"
