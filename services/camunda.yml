# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Operaton (BPMN workflow & decision engine)
# ═══════════════════════════════════════════════════════════════
# Operaton — the community-owned Apache 2.0 successor of Camunda 7 CE
# (same engine lineage, API/model/DB-schema compatible).  Spring Boot
# distribution: BPMN 2.0 process engine, DMN decision tables, REST API
# (/engine-rest/), and web apps (Cockpit, Tasklist, Admin) at
# https://bpm.<domain>/operaton/app/
#
# Include via: COMPOSE_FILE=…:services/camunda.yml
# Or via profile: docker compose --profile camunda up -d
#
# Requires: PostgreSQL (core, camunda_db)
#
# The upstream image ships H2/MySQL/PostgreSQL JDBC drivers; no
# custom build is needed. DB_* env vars configure the datasource at
# boot (the entrypoint translates them to SPRING_DATASOURCE_*).
# WAIT_FOR pauses boot until postgres is accepting TCP connections.
#
# Service name and profile retain the "camunda" label for backward
# compatibility — the image is swappable via CAMUNDA_IMAGE.
# ═══════════════════════════════════════════════════════════════

services:
  camunda:
    <<: *service-defaults
    image: ${CAMUNDA_IMAGE:-operaton/operaton:2.1.5}
    container_name: opensme-camunda
    # Run launcher flags: without ANY flag it enables REST+Webapps+Example,
    # but NOT the OAuth2 starter. --oauth2 --rest --webapps pulls in the
    # spring-security jars (/operaton/internal/oauth2) + webapps + engine-rest;
    # the example is intentionally left out (no second engine context).
    command: ["./operaton.sh", "--oauth2", "--rest", "--webapps"]
    # docker DNS maps ${ZITADEL_DOMAIN} to the zitadel container (hostname
    # trick) where only :8080/http listens -> OIDC issuer discovery on
    # https:443 fails from inside. Route the FQDN to the compose gateway
    # instead: traefik (host network, :443) terminates TLS and routes by
    # Host header back to zitadel; the Let's Encrypt chain is JRE-trusted.
    extra_hosts:
      - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}:host-gateway"
    restart: unless-stopped
    profiles: ["camunda"]
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/camunda_db
      DB_USERNAME: camunda_user
      DB_PASSWORD: ${CAMUNDA_DB_PASSWORD:?CAMUNDA_DB_PASSWORD must be set in .env}
      WAIT_FOR: postgres:5432
      WAIT_FOR_TIMEOUT: "60"
      TZ: ${TZ:-Europe/Berlin}
      # ── ZITADEL SSO (native OAuth2) ──────────────────────────────────
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OPERATON_CLIENT_ID: ${OPERATON_OIDC_CLIENT_ID:?OPERATON_OIDC_CLIENT_ID must be set in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OPERATON_CLIENT_SECRET: ${OPERATON_OIDC_CLIENT_SECRET:?OPERATON_OIDC_CLIENT_SECRET must be set in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OPERATON_CLIENT_AUTHENTICATION_METHOD: client_secret_basic
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OPERATON_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OPERATON_REDIRECT_URI: "{baseUrl}/login/oauth2/code/operaton"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OPERATON_SCOPE: "openid,profile,email"
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OPERATON_ISSUER_URI: "https://${ZITADEL_DOMAIN:?ZITADEL_DOMAIN must be set in .env}"
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OPERATON_USER_NAME_ATTRIBUTE: preferred_username
      OPERATON_BPM_OAUTH2_USER_NAME_ATTRIBUTE: preferred_username
      OPERATON_BPM_OAUTH2_SSO_LOGOUT_ENABLED: "true"
      OPERATON_BPM_OAUTH2_IDENTITY_PROVIDER_ENABLED: "false"
      # The bundled invoice example app builds a SECOND engine context
      # (same crash vector) -- disable for production/SSO.
      OPERATON_BPM_RUN_EXAMPLE_ENABLED: "false"
      # Trust Traefik X-Forwarded-* so the OAuth2 redirect_uri/baseUrl keeps
      # https behind the reverse proxy (else authorize lands with http://).
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # ── ZITADEL identity provider plugin ─────────────────────────────
      PLUGIN_IDENTITY_ZITADEL_APIURL: "https://${ZITADEL_DOMAIN:?ZITADEL_DOMAIN must be set in .env}"
      PLUGIN_IDENTITY_ZITADEL_PAT: ${ZITADEL_PAT:?ZITADEL_PAT must be set in .env}
      PLUGIN_IDENTITY_ZITADEL_USEUSERNAMEASOPERATONUSERID: "true"
      PLUGIN_IDENTITY_ZITADEL_ADMINISTRATORROLEKEY: operaton-admin
      PLUGIN_IDENTITY_ZITADEL_ADMINISTRATORGROUPNAME: camunda-admin
    volumes:
      - camunda-data:/operaton/configuration/userlib
      # ReadOnly IdP: image default.yml bakes admin-user(id=demo) which
      # crashes engine build (user query outside command context).
      - ./services/operaton-default.yml:/operaton/configuration/default.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.camunda.rule=Host(`${CAMUNDA_DOMAIN:-bpm.${OPENSME_DOMAIN:-opensme.graphwiz.ai}}`)"
      - "traefik.http.routers.camunda.tls=true"
      - "traefik.http.routers.camunda.entrypoints=websecure"
      - "traefik.http.services.camunda.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/engine-rest/engine"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Spring Boot cold start: first boot creates schema + indexes
      start_period: 120s
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  camunda-data:
