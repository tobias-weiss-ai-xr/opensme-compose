# openSME — Operaton Run configuration (overrides the image's default.yml)
# Derived from the operaton/operaton:2.1.5 default.yml with two changes:
#   1. admin-user block REMOVED — the engine runs a ReadOnly identity
#      provider (ZITADEL). CreateAdminUserConfiguration performs a user
#      query OUTSIDE a command context, which crashes the engine with a
#      read-only IdP (Operaton keycloak docs: "must NOT configure an
#      admin-user"). Without this block the
#      @ConditionalOnProperty(prefix="operaton.bpm.admin-user",name="id")
#      guard keeps the bean absent.
#   2. run.example.enabled: false — the bundled invoice example app builds
#      a second process engine context.
# Everything else is identical to the image default.

operaton.bpm:
  filter:
    create: All tasks
  run:
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#cross-origin-resource-sharing
    cors:
      enabled: true
      allowed-origins: "*"
    rest:
      disable-wadl: false
    deployment:
      deploy-changed-only: true
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#example-application
    example:
      enabled: false

# datasource configuration is required
spring.datasource:
  url: jdbc:h2:./operaton-h2-default/process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: sa

spring.web.resources:
  static-locations: NULL
