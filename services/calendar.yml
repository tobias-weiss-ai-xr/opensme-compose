# ───────────────────────────────────────────────────────────────────────────
# DEPRECATED — ADOPTED INTO THE CORE STACK (2026-11-07)
#
# The Public Calendar (calrs booking + dedicated Radicale CalDAV) is now a
# first-class, default-included part of the main `docker-compose.yml`:
#
#   service `calendar`            (edge-routed at $CALENDAR_DOMAIN)
#   service `calendar-radicale`   (internal-only CalDAV store)
#   volumes `calrs-data`, `radicale-config`, `radicale-data`
#
# This file intentionally defines NOTHING. It is kept as a compatibility
# shim so existing deployment chains that still reference it via
#   COMPOSE_FILE=docker-compose.yml:services/calendar.yml
# or start commands that pass `--profile calendar` keep parsing and merge
# harmlessly (an empty overlay adds no services, no conflicts).
#
# You can safely remove `services/calendar.yml` from your COMPOSE_FILE and
# drop `--profile calendar` — the services are always included now.
# Full documentation: docs/calendar.md · provisioning: scripts/calendar-setup.sh
# ───────────────────────────────────────────────────────────────────────────
