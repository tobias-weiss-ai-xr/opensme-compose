# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Element-Web (Matrix Web Client)
# ═══════════════════════════════════════════════════════════════
# Web client for Matrix/Synapse. Optional — users can also use
# native clients (FluffyChat, Element Desktop).
#
# Include via: COMPOSE_FILE=docker-compose.yml:services/element.yml
# Or via profile: docker compose --profile element up -d
#
# Requires: services/synapse.yml (--profile chat)
# ═══════════════════════════════════════════════════════════════

services:
  element-web:
    <<: *service-defaults
    image: vectorim/element-web:latest
    container_name: opensme-element
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    profiles: ["element"]
    environment:
      # entrypoint envsubst renders listen ${ELEMENT_WEB_PORT}; default 80 is
      # unbindable (unprivileged container, capability +ep lost via entrypoint
      # user switch) — use the unprivileged 8080 like the old elementio layout
      ELEMENT_WEB_PORT: "8080"
      # Homeserver the web client should talk to. The stock element-web
      # entrypoint only renders config.json from a *.template (envsubst-on-
      # templates); the image ships a baked config.json (matrix.org) and no
      # template, so ELEMENT_DEFAULT_SERVER_URL was being ignored and the UI
      # pointed at matrix.org (seen live 2026-10-26). We render our own
      # config.json from services/element-config.json.template in a small
      # pre-entrypoint below.
      ELEMENT_DEFAULT_SERVER_URL: "https://matrix.${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      ELEMENT_HOMESERVER_NAME: "matrix.${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
    volumes:
      - ./services/element-config.json.template:/render/config.json.template:ro
    # Render the homeserver config deterministically (envsubst), then run the
    # stock entrypoint. envsubst is present in the image (alpine).
    entrypoint:
      - /bin/sh
      - -c
      - "envsubst < /render/config.json.template > /usr/share/nginx/html/config.json && exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.element.rule=Host(`element.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.element.tls=true"
      - "traefik.http.routers.element.tls.certresolver=letsencrypt"
      - "traefik.http.routers.element.entrypoints=websecure"
      - "traefik.http.services.element.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 48M
        reservations:
          cpus: "0.05"
          memory: 8M
