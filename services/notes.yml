# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Notes/Impress (Collaborative Note-Taking)
# ═══════════════════════════════════════════════════════════════
# Structured collaborative document editing with Yjs collaboration.
# Uses MinIO for S3 media storage.
#
# Include via: COMPOSE_FILE=docker-compose.yml:services/notes.yml
# Or via profile: docker compose --profile notes up -d
#
# Requires: PostgreSQL (core), Redis (core), Zitadel (for OIDC)
# ═══════════════════════════════════════════════════════════════

services:
  notes-backend:
    <<: *service-defaults
    image: lasuite/impress-backend:latest
    container_name: opensme-notes-backend
    restart: unless-stopped
    profiles: ["notes"]
    environment:
      DJANGO_SETTINGS_MODULE: impress.settings.Production
      DJANGO_SECRET_KEY: ${NOTES_DJANGO_SECRET_KEY:-CHANGEME_notes}
      ALLOWED_HOSTS: "notes.${OPENSME_DOMAIN:-opensme.graphwiz.ai},notes-backend"
      DATA_DIR: /data
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: notes_db
      DB_USER: notes_user
      DB_PASSWORD: ${NOTES_DB_PASSWORD:-CHANGEME_notes}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/1
      OIDC_RP_CLIENT_ID: "opensme-notes"
      OIDC_RP_CLIENT_SECRET: ${NOTES_OIDC_CLIENT_SECRET:-CHANGEME_notes_oidc}
      OIDC_OP_JWKS_ENDPOINT: "https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}/.well-known/openid-configuration/jwks"
      OIDC_OP_AUTHORIZATION_ENDPOINT: "https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}/oauth/v2/authorize"
      OIDC_OP_TOKEN_ENDPOINT: "https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}/oauth/v2/token"
      OIDC_OP_USER_ENDPOINT: "https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}/oidc/v1/userinfo"
      OIDC_RP_SCOPES: "openid profile email"
      OIDC_CREATE_USER: "true"
      OIDC_STORE_ID_TOKEN: "true"
      LOGIN_REDIRECT_URL: "https://notes.${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      COLLABORATION_API_URL: "https://notes.${OPENSME_DOMAIN:-opensme.graphwiz.ai}/collaboration/api/"
      COLLABORATION_WS_URL: "wss://notes.${OPENSME_DOMAIN:-opensme.graphwiz.ai}/collaboration/ws/"
      COLLABORATION_SERVER_SECRET: ${NOTES_COLLABORATION_SECRET:-CHANGEME_notes_collab}
      Y_PROVIDER_API_BASE_URL: http://notes-y-provider:4444
      Y_PROVIDER_API_KEY: ${NOTES_COLLABORATION_SECRET:-CHANGEME_notes_collab}
      AWS_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_S3_ACCESS_KEY_ID: ${OC_S3_ACCESS_KEY:-minio}
      AWS_S3_SECRET_ACCESS_KEY: ${OC_S3_SECRET_KEY:-CHANGEME_minio}
      AWS_STORAGE_BUCKET_NAME: notes-media
    volumes:
      - notes-data:/data
    networks:
      - opensme-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notes-y-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3010/api/v1.0/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.35"
          # 256M OOM-killed Django boot (SIGKILL from kernel OOM, 2026-10-13
          # live deploy) — 512M leaves headroom for migrations + gunicorn
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M

  notes-frontend:
    <<: *service-defaults
    image: lasuite/impress-frontend:latest
    container_name: opensme-notes-frontend
    restart: unless-stopped
    profiles: ["notes"]
    environment:
      NOTES_BACKEND_URL: http://notes-backend:3010
      NOTES_Y_PROVIDER_URL: http://notes-y-provider:1234
    networks:
      - opensme-net
    depends_on:
      notes-backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notes.rule=Host(`notes.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.notes.tls=true"
      - "traefik.http.routers.notes.tls.certresolver=letsencrypt"
      - "traefik.http.routers.notes.entrypoints=websecure"
      - "traefik.http.services.notes.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-O", "/dev/null", "http://localhost:80/"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 8M

  notes-y-provider:
    <<: *service-defaults
    image: lasuite/impress-y-provider:latest
    container_name: opensme-notes-y-provider
    restart: unless-stopped
    profiles: ["notes"]
    environment:
      Y_PROVIDER_API_KEY: ${NOTES_COLLABORATION_SECRET:-CHANGEME_notes_collab}
    networks:
      - opensme-net
    healthcheck:
      # the app listens on 4444 (see its own startup log), not 1234
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-O", "/dev/null", "http://localhost:4444/"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.15"
          # 64M OOM-killed the node start-server within seconds (SIGKILL,
          # 2026-10-13 live deploy) — node needs ~200M RSS at boot
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

volumes:
  notes-data:
