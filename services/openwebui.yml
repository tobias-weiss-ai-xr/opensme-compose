# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — OpenWebUI (AI chat frontend)
# ═══════════════════════════════════════════════════════════════
# Chat UI in the openEduSuite pattern: one AI surface for the whole
# suite, wired to the LiteLLM gateway (services/litellm.yml) — NOT to
# Ollama directly. Ollama is only a fallback and sits behind the
# gateway's router (automatic per-request failover), so it never
# appears as a separate provider here.
#
# Include via: COMPOSE_FILE=…:services/litellm.yml:monitoring/ollama.yml:services/openwebui.yml
#
# Requires in .env:
#   LITELLM_MASTER_KEY   gateway auth (shared with services/litellm.yml)
#
# First start: sign up once — the first account becomes admin; then set
# ENABLE_SIGNUP=false in .env and recreate to lock the instance down.
# SSO via Zitadel OIDC is a documented follow-up (OPENWEBUI_OAUTH_* env).
# ═══════════════════════════════════════════════════════════════

services:
  openwebui:
    <<: *service-defaults
    image: ghcr.io/open-webui/open-webui:main
    container_name: opensme-openwebui
    restart: unless-stopped
    extra_hosts:
      - "${ZITADEL_DOMAIN:-auth.home.opensme.graphwiz.ai}:host-gateway"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      # models = LiteLLM gateway (upstream catalog + automatic Ollama fallback)
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required (gateway auth)}
      ENABLE_OLLAMA_API: "false"
      WEBUI_URL: ${WEBUI_URL:-https://ai.${OPENSME_DOMAIN:-home.opensme.graphwiz.ai}}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}
      # SSO via Zitadel (OIDC). Callback path must match the Zitadel app's
      # redirect URI: https://ai.<domain>/oauth/oidc/callback
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP:-true}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: ${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-oidc}
      OAUTH_CLIENT_ID: ${OPENWEBUI_OAUTH_CLIENT_ID:?OPENWEBUI_OAUTH_CLIENT_ID must be set in .env}
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OAUTH_CLIENT_SECRET:?OPENWEBUI_OAUTH_CLIENT_SECRET must be set in .env}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL:?OPENID_PROVIDER_URL must be set in .env}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid email profile}
      OAUTH_CODE_CHALLENGE_METHOD: ${OAUTH_CODE_CHALLENGE_METHOD:-S256}
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=Host(`${AI_DOMAIN:-ai.${OPENSME_DOMAIN:-home.opensme.graphwiz.ai}}`)"
      - "traefik.http.routers.ai.tls=true"
      - "traefik.http.routers.ai.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ai.entrypoints=websecure"
      - "traefik.http.services.ai.loadbalancer.server.port=8080"
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  openwebui-data:
