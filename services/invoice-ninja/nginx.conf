# invoiceninja fpm front — behind traefik (TLS terminates there)
#
# SSO-ONLY: guests never see the local login form. A browser without an
# Invoice Ninja session cookie (`laravel_session`) is sent straight to
# /auth/oidc (Zitadel login) — no email/password dialog, no button click.
# Authenticated users keep normal SPA access (their cookie skips the rule).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/app/public;
    index index.php;

    client_max_body_size 20M;

    # Laravel/API/OIDC/health paths — reach the app untouched (these are
    # ^~ prefix matches, so they also beat the .php regex below).
    location ^~ /api/           { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /auth/          { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /oauth-callback { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /setup          { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /update         { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /password/      { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /storage/       { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /health         { return 200 "ok\n"; }

    # static assets — serve from disk directly
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map|webmanifest)$ {
        try_files $uri =404;
    }

    # everything else is the SPA — logged-out browsers go straight to SSO
    location / {
        if ($cookie_laravel_session = "") {
            return 302 /auth/oidc;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass invoiceninja:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
}
