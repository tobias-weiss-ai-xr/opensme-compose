# invoiceninja fpm front — behind traefik (TLS terminates there)
#
# SSO-ONLY: guests never see the local login form. A browser without an
# Invoice Ninja session cookie (`laravel_session`) is sent straight to
# /auth/oidc (Zitadel login) — no email/password dialog, no button click.
# Authenticated users keep normal SPA access (their cookie skips the rule).
#
# Security: All responses get security headers to harden the application.
# Performance: Static assets are cached aggressively.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/app/public;
    index index.php;

    # Buffer sizes for large file uploads (invoices, PDFs, etc.)
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' blob:; frame-src 'self' blob:;" always;

    # Laravel/API/OIDC/health paths — reach the app untouched (these are
    # ^~ prefix matches, so they also beat the .php regex below).
    location ^~ /api/           { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /auth/          { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /oauth-callback { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /setup          { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /update         { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /password/      { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /storage/       { try_files $uri $uri/ /index.php?$query_string; }

    # Health check endpoint — static response for container orchestration.
    # Real app readiness is covered by the fpm container's own healthcheck
    # (php-fpm probe + Laravel boot sanity in the entrypoint), so a static
    # 200 here is correct: if nginx answers, the front is up.
    location ^~ /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # static assets — serve from disk directly with long cache TTL
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map|webmanifest)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # everything else is the SPA — logged-out browsers go straight to SSO
    location / {
        # SSO-ONLY: anytime there is no Laravel session cookie, redirect to OIDC
        # absolute https URL on purpose: a relative Location is absolutised by
        # nginx with the *upstream* scheme (http, since traefik terminates TLS),
        # costing an extra http->https hop on every logged-out visit.
        if ($cookie_laravel_session = "") {
            return 302 https://$host/auth/oidc;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass invoiceninja:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # buffering to prevent slow client connections from blocking PHP
        fastcgi_buffering on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_busy_buffers_size 24k;
        fastcgi_temp_file_write_size 256k;
    }

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.php?$query_string;
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /var/www/app/public;
        internal;
    }
}
