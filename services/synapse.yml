# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Synapse (Matrix Chat Server)
# ═══════════════════════════════════════════════════════════════
# Decentralized messaging. OIDC login via Zitadel.
# Config is generated at startup by services/synapse-setup.sh.
#
# Include via: COMPOSE_FILE=docker-compose.yml:services/synapse.yml
# Or via profile: docker compose --profile chat up -d
#
# Requires: PostgreSQL (core), Zitadel (idm/zitadel.yml) for OIDC
# ═══════════════════════════════════════════════════════════════

services:
  synapse:
    <<: *service-defaults
    cap_drop:
      - ALL
    image: matrixdotorg/synapse:latest
    container_name: opensme-synapse
    restart: unless-stopped
    profiles: ["chat"]
    environment:
      DOMAIN: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      SYNAPSE_SERVER_NAME: "matrix.${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      SYNAPSE_REPORT_STATS: "no"
      POSTGRES_USER: synapse_user
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:-CHANGEME_synapse}
      POSTGRES_DB: synapse_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Zitadel OIDC — a real (non-CHANGEME) client id is the opt-in switch
      # for the oidc_providers block in synapse-setup.sh; the pair is minted
      # by scripts/zitadel-client.sh --app synapse
      SYNAPSE_OIDC_CLIENT_ID: ${SYNAPSE_OIDC_CLIENT_ID:-}
      SYNAPSE_OIDC_CLIENT_SECRET: ${SYNAPSE_OIDC_CLIENT_SECRET:-CHANGEME_synapse_oidc}
      # issuer for the oidc_providers block — must be in the container env,
      # the setup script's fallback default is the wrong (non-live) domain
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
    volumes:
      - synapse-data:/data
      - ./services/synapse-setup.sh:/entrypoint-setup.sh:ro
    networks:
      - opensme-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    # no --daemonize: matrixdotorg/synapse homeserver.py takes -D as a bare
    # flag (store_true) — "--daemonize=false" aborts with 'ignored explicit
    # argument'. Foreground is what we want under docker anyway.
    command: ["-c", "sh /entrypoint-setup.sh && exec /usr/local/bin/python -m synapse.app.homeserver --config-path /data/homeserver.yaml"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matrix.rule=Host(`matrix.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.matrix.tls=true"
      - "traefik.http.routers.matrix.tls.certresolver=letsencrypt"
      - "traefik.http.routers.matrix.entrypoints=websecure"
      - "traefik.http.services.matrix.loadbalancer.server.port=8008"
    healthcheck:
      test: ["CMD", "curl", "-fS", "http://127.0.0.1:8008/_matrix/federation/v1/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 64M

volumes:
  synapse-data:
