# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Invoice Ninja
# ═══════════════════════════════════════════════════════════════
# Invoicing and billing for SMEs.
# Include via: COMPOSE_FILE=docker-compose.yml:services/invoice-ninja.yml
# Or via profile: docker compose --profile invoice up -d
#
# Requires: PostgreSQL (core), Stalwart (for email notifications)
# ═══════════════════════════════════════════════════════════════

services:
  # Invoiceninja's pgsql "support" is broken upstream (v5 migrations contain
  # MySQL-dialect SQL, e.g. `ALTER TABLE ... MODIFY COLUMN`) — give it the
  # officially supported MariaDB instead of the shared postgres.
  invoiceninja-db:
    <<: *service-defaults
    image: ${MARIADB_IMAGE:-mariadb:11}
    container_name: opensme-invoiceninja-db
    restart: unless-stopped
    profiles: ["invoice"]
    command: --transaction-isolation=READ-COMMITTED --innodb-buffer-pool-size=128M
    environment:
      MARIADB_DATABASE: invoiceninja_db
      MARIADB_USER: invoiceninja_user
      MARIADB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:?INVOICENINJA_DB_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${INVOICENINJA_DB_ROOT_PASSWORD:?INVOICENINJA_DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - invoiceninja-db:/var/lib/mysql
    network_mode: service:invoiceninja-web
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  invoiceninja:
    <<: *service-defaults
    image: invoiceninja-pg:5
    # upstream image lacks pdo_pgsql and OIDC support — local build adds
    # both via services/invoice-ninja/Dockerfile. 'local build' tag inhibits
    # watchtower auto-updates (we rebuild manually when base image changes).
    labels: ["com.centurylinklabs.watchtower.enable=false"]  # local build
    build: ./services/invoice-ninja
    container_name: opensme-invoiceninja
    restart: unless-stopped
    profiles: ["invoice"]
    entrypoint: ["/invoiceninja-entrypoint.sh"]
    environment:
      APP_URL: "https://invoices.${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      # HOSTING NOTE: on live chains opensme-coexist.yml overrides APP_URL
      # and the router to ${INVOICE_DOMAIN} (invoices.home.… convention).
      # The Zitadel app's registered redirect URI MUST match whatever this
      # deployment serves at /auth/oidc — a plain-env registration bakes in
      # invoices.<OPENSME_DOMAIN> and breaks SSO (redirect_uri mismatch).
      # tests/05-e2e/stories.py M4 pins served == registered.
      # The entrypoint bakes .env into the container layer on first boot — a
      # recreate loses it (and the APP_KEY it auto-generated), so the key must
      # be supplied explicitly and persisted in the host .env.
      APP_KEY: ${INVOICENINJA_APP_KEY:-}
      # Laravel app settings
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: error
      # OIDC SSO via Zitadel (config/services.php -> services.oidc; Socialite
      # 'oidc' driver). Callback URI registered at the IdP: ${APP_URL}/auth/oidc
      OIDC_ISSUER: ${INVOICENINJA_OIDC_ISSUER:-https://auth.home.opensme.graphwiz.ai}
      OIDC_CLIENT_ID: ${INVOICENINJA_OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${INVOICENINJA_OIDC_CLIENT_SECRET:?}
      OIDC_PROVIDER_LABEL: ${INVOICENINJA_OIDC_PROVIDER_LABEL:-openSME Zitadel}
      # Outbound HTTPS via host proxy — some hosts drop container hairpin to
      # the public IdP domain (:443); discovery/token/userinfo then go through
      # the proxy (guzzle honours these env vars) — same pattern as the portal.
      HTTPS_PROXY: ${INVOICENINJA_HTTPS_PROXY:-}
      HTTP_PROXY: ${INVOICENINJA_HTTP_PROXY:-}
      NO_PROXY: ${INVOICENINJA_NO_PROXY:-}
      # Database: MariaDB (upstream pgsql migrations broken in v5)
      DB_HOST: invoiceninja-db
      DB_PORT: "3306"
      DB_DATABASE: invoiceninja_db
      DB_USERNAME: invoiceninja_user
      DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:?INVOICENINJA_DB_PASSWORD must be set in .env}
      DB_TYPE: mysql
      # Laravel reads DB_CONNECTION (DB_TYPE is a invoiceninja-doc but
      # dead name — without this it defaults to the mysql driver)
      DB_CONNECTION: mysql
      # Database connection pooling via MySQL `wait_timeout` tuning
      # Keep connections alive across requests (matches확 redis session TTL)
      MYSQL_WAIT_TIMEOUT: "28800"
      # Email: internal SMTP via Stalwart (no external relay)
      MAIL_MAILER: smtp
      MAIL_HOST: stalwart
      MAIL_PORT: "25"
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDRESS: "invoices@${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      MAIL_FROM_NAME: "${OPENSME_COMPANY_NAME:-openSME Invoicing}"
      # Auto-create user accounts on first OIDC login (no confirmation email)
      REQUIRE_CONFIRMATION: "false"
      SET_UNCONFIRMED: "true"
      SELF_UPDATE: "false"
      # Session driver: redis for shared cache across fpm workers
      SESSION_DRIVER: redis
      SESSION_LIFETIME: "1440"  # 24 hours in minutes
      SESSION_DOMAIN: ".${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      SESSION_SECURE_COOKIE: "true"
      # Cache driver: redis for query caching
      CACHE_DRIVER: redis
      # Queue: database driver (simple, no external queue service needed)
      QUEUE_CONNECTION: database
      # Queue worker concurrency (matches resource limits)
      QUEUE_WORKER_SLEEP: "3"
      QUEUE_WORKER_TIMEOUT: "60"
      # ── S3-compatible object storage: SeaweedFS (was MinIO) ──────────
      # Default storage driver: s3. Files (invoices, PDFs, logos, etc.)
      # go to the shared object store instead of the local storage volume.
      # This enables cross-container access (paperless can ingest directly
      # from the bucket) and unified lifecycle/backups.
      # Local volumes (invoiceninja-public, invoiceninja-storage) stay as
      # a cold fallback — existing files are NOT migrated automatically.
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${OC_S3_ACCESS_KEY:-minio}
      AWS_SECRET_ACCESS_KEY: ${OC_S3_SECRET_KEY:?OC_S3_SECRET_KEY must be set in .env}
      AWS_DEFAULT_REGION: ${OC_S3_REGION:-us-east-1}
      AWS_BUCKET: ${INVOICENINJA_S3_BUCKET:-invoiceninja}
      AWS_ENDPOINT: ${OC_S3_ENDPOINT:-http://minio:9000}
      AWS_URL: ${OC_S3_ENDPOINT:-http://minio:9000}
      # S3 settings: path-style addressing ( SeaweedFS only speaks http, not https)
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # URL-signed expiries (hours) for file download links sent to clients
      NINJA_S3_FILE_EXPIRES: "24"
    volumes:
      - invoiceninja-public:/var/www/app/public
      - invoiceninja-storage:/var/www/app/storage
    network_mode: service:invoiceninja-web
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # fpm image: no HTTP on :9000 (FastCGI) — check both process and
      # that the artisan config cache is current (signals Laravel booted)
      test: ["CMD-SHELL", "pgrep -f php-fpm > /dev/null && test -f /var/www/app/bootstrap/cache/config.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          # 192M OOM-killed the app during Laravel boot against a migrated
          # (non-empty) DB — supervisor then exits cleanly and the container
          # flaps forever. 512M leaves ample headroom for artisan optimize.
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Laravel queue worker for Invoice Ninja
  # Processes queued jobs (PDF generation, email notifications, etc.)
  # Uses the same built image as the main fpm container
  invoiceninja-worker:
    <<: *service-defaults
    image: invoiceninja-pg:5
    build: ./services/invoice-ninja
    container_name: opensme-invoiceninja-worker
    restart: unless-stopped
    profiles: ["invoice"]
    entrypoint: ["/invoiceninja-entrypoint.sh"]
    command: ["php", "/var/www/app/artisan", "queue:work", "--daemon", "--sleep=3", "--tries=3"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: invoiceninja-db
      DB_PORT: "3306"
      DB_DATABASE: invoiceninja_db
      DB_USERNAME: invoiceninja_user
      DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:?INVOICENINJA_DB_PASSWORD must be set in .env}
      DB_CONNECTION: mysql
      QUEUE_CONNECTION: database
      # Session and cache: use redis like main fpm container
      SESSION_DRIVER: redis
      CACHE_DRIVER: redis
      # Mail settings (same as fpm)
      MAIL_MAILER: smtp
      MAIL_HOST: stalwart
      MAIL_PORT: "25"
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDRESS: "invoices@${OPENSME_DOMAIN:-opensme.graphwiz.ai}"
      MAIL_FROM_NAME: "openSME Invoicing"
      # File storage (same S3 config as fpm)
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${OC_S3_ACCESS_KEY:-minio}
      AWS_SECRET_ACCESS_KEY: ${OC_S3_SECRET_KEY:?OC_S3_SECRET_KEY must be set in .env}
      AWS_DEFAULT_REGION: ${OC_S3_REGION:-us-east-1}
      AWS_BUCKET: ${INVOICENINJA_S3_BUCKET:-invoiceninja}
      AWS_ENDPOINT: ${OC_S3_ENDPOINT:-http://minio:9000}
      AWS_URL: ${OC_S3_ENDPOINT:-http://minio:9000}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    volumes:
      - invoiceninja-storage:/var/www/app/storage
    network_mode: service:invoiceninja-web
    depends_on:
      invoiceninja:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  # nginx front for the fpm container; serves the shared public volume and
  # forwards FastCGI to the "invoiceninja" service
  invoiceninja-web:
    <<: *service-defaults
    image: ${INVOICENINJA_NGINX_IMAGE:-nginx:alpine}
    container_name: opensme-invoiceninja-web
    restart: unless-stopped
    profiles: ["invoice"]
    volumes:
      - ./services/invoice-ninja/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - invoiceninja-public:/var/www/app/public:ro
    networks:
      opensme-net:
        aliases:
          - invoiceninja
          - invoiceninja-db
          - opensme-invoiceninja
          - opensme-invoiceninja-db
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.invoices.rule=Host(`invoices.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.invoices.tls=true"
      - "traefik.http.routers.invoices.entrypoints=websecure"
      - "traefik.http.services.invoices.loadbalancer.server.port=80"
      # NOTE: no certresolver here — internal hosts without LE use the
      # host-only compose.internal.yml to override these labels
    healthcheck:
      # env -u: never let host-injected proxy env redirect the health probe.
      # Use --spider to avoid writing to disk and --max-redirect=0 to
      # avoid following the SSO redirect (we just want nginx to answer).
      test: ["CMD-SHELL", "env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY wget -q --spider --max-redirect=0 -O /dev/null http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

volumes:
  invoiceninja-public:
  invoiceninja-storage:
  invoiceninja-db:
