<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img">
  <title>openSME — KI-Assistenz als nächtlicher Sternenhimmel nach Vincent van Gogh</title>
  <desc>Wirbelnder Nachthimmel über einer Stadt mit erleuchteten Fenstern; die KI als heller Abendstern.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12244d"/>
      <stop offset="0.7" stop-color="#1e3f77"/>
      <stop offset="1" stop-color="#2a5298"/>
    </linearGradient>
  </defs>
  <rect width="1680" height="1040" fill="url(#sky)"/>
  <!-- swirling sky strokes -->
  <g fill="none" stroke-linecap="round">
    <path d="M 120 220 C 360 60 620 140 640 300 C 655 430 480 500 380 430 C 300 370 340 260 460 260" stroke="#3f6db5" stroke-width="16"/>
    <path d="M 900 160 C 1180 60 1500 140 1620 300" stroke="#4a7ab5" stroke-width="14"/>
    <path d="M 980 340 C 1200 260 1460 320 1580 460" stroke="#35619f" stroke-width="12"/>
    <path d="M 120 480 C 320 400 560 430 760 520" stroke="#2c4f8e" stroke-width="12"/>
    <path d="M 680 200 C 760 180 820 220 830 280" stroke="#5c8cc9" stroke-width="10"/>
  </g>
  <!-- the great swirl -->
  <g fill="none" stroke-linecap="round">
    <path d="M 1180 520 C 1180 420 1300 400 1360 470 C 1420 540 1370 640 1280 630 C 1200 622 1170 540 1230 490 C 1280 450 1350 480 1360 540" stroke="#5c8cc9" stroke-width="12"/>
    <path d="M 1100 620 C 1200 700 1400 700 1520 600" stroke="#35619f" stroke-width="10"/>
  </g>
  <!-- stars with halos -->
  <g>
    <circle cx="360" cy="240" r="58" fill="#4a7ab5" opacity="0.55"/>
    <circle cx="360" cy="240" r="26" fill="#f2d55c"/>
    <circle cx="820" cy="140" r="44" fill="#4a7ab5" opacity="0.55"/>
    <circle cx="820" cy="140" r="20" fill="#f2d55c"/>
    <circle cx="200" cy="620" r="40" fill="#4a7ab5" opacity="0.5"/>
    <circle cx="200" cy="620" r="18" fill="#f2d55c"/>
    <circle cx="1560" cy="200" r="36" fill="#4a7ab5" opacity="0.5"/>
    <circle cx="1560" cy="200" r="16" fill="#f2d55c"/>
  </g>
  <!-- crescent moon -->
  <path d="M 1440 400 A 90 90 0 1 1 1439 399 Z M 1408 350 A 60 60 0 1 0 1409 350 Z" fill="#f2d55c" fill-rule="evenodd" opacity="0.95"/>
  <circle cx="1440" cy="400" r="110" fill="#f2d55c" opacity="0.12"/>
  <!-- evening star: the AI assistant, brightest above the town -->
  <circle cx="840" cy="560" r="74" fill="#f2d55c" opacity="0.2"/>
  <circle cx="840" cy="560" r="40" fill="#f2d55c"/>
  <circle cx="840" cy="560" r="18" fill="#fff3c4"/>
  <!-- horizon: dark hills + town -->
  <path d="M 0 800 C 300 760 520 820 840 800 C 1160 780 1400 820 1680 790 L 1680 1040 L 0 1040 Z" fill="#0d1b38"/>
  <!-- church spire -->
  <path d="M 420 812 L 420 700 L 448 650 L 476 700 L 476 812 Z" fill="#0a1630"/>
  <!-- houses with lit windows -->
  <g fill="#0a1630">
    <rect x="520" y="770" width="150" height="90"/>
    <rect x="700" y="740" width="130" height="120"/>
    <rect x="900" y="780" width="170" height="80"/>
    <rect x="1120" y="750" width="140" height="110"/>
  </g>
  <g fill="#f2d55c">
    <rect x="548" y="792" width="22" height="26"/>
    <rect x="596" y="792" width="22" height="26"/>
    <rect x="730" y="770" width="22" height="26"/>
    <rect x="778" y="770" width="22" height="26"/>
    <rect x="938" y="800" width="22" height="26"/>
    <rect x="1000" y="800" width="22" height="26"/>
    <rect x="1150" y="778" width="22" height="26"/>
    <rect x="1198" y="778" width="22" height="26"/>
  </g>
  <!-- cypress: the spark of thought -->
  <path d="M 1620 1040 C 1580 900 1600 800 1620 720 C 1640 800 1660 900 1660 1040 Z" fill="#15351f"/>
  <!-- wordmark -->
  <text x="120" y="960" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f2e8c9" letter-spacing="12">openSME</text>
</svg>
