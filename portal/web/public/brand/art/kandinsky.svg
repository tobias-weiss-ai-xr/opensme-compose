<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img">
  <title>openSME — digitale Kommunikation als konkrete Kunst nach Wassily Kandinsky</title>
  <desc>Chat, Meet und Terminbuchung in Kreisen, Linien und Halbkreisen.</desc>
  <rect width="1680" height="1040" fill="#efe6d0"/>
  <!-- sweeping background arc -->
  <path d="M -100 900 Q 620 460 1780 640" stroke="#2b4a6f" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M -100 1010 Q 760 620 1780 780" stroke="#8a2f2b" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- chat: big concentric circle left -->
  <g>
    <circle cx="460" cy="420" r="250" fill="#225095"/>
    <circle cx="460" cy="420" r="180" fill="#efe6d0"/>
    <circle cx="460" cy="420" r="110" fill="#e8b620"/>
    <circle cx="460" cy="420" r="52" fill="#d0342c"/>
  </g>
  <!-- meet: camera glyph in a circle top right -->
  <g transform="translate(1240,260)">
    <circle r="190" fill="#2e6b4f"/>
    <rect x="-92" y="-58" width="140" height="116" rx="16" fill="#efe6d0"/>
    <path d="M 58 -18 L 128 -58 L 128 58 L 58 18 Z" fill="#efe6d0"/>
  </g>
  <!-- booking: calendar tick marks and a rising sun arc -->
  <g stroke="#111111" stroke-width="12" stroke-linecap="round">
    <line x1="880" y1="760" x2="880" y2="812"/>
    <line x1="980" y1="760" x2="980" y2="812"/>
    <line x1="1080" y1="760" x2="1080" y2="812"/>
  </g>
  <path d="M 830 900 A 150 150 0 0 1 1130 900 Z" fill="#e8b620" stroke="#111111" stroke-width="12"/>
  <!-- scattered composition dots and lines -->
  <g stroke="#111111" stroke-width="10" stroke-linecap="round" fill="#111111">
    <line x1="640" y1="150" x2="900" y2="260"/>
    <circle cx="640" cy="150" r="14"/>
    <circle cx="900" cy="260" r="14"/>
    <line x1="1420" y1="560" x2="1560" y2="700"/>
  </g>
  <circle cx="1560" cy="700" r="22" fill="#d0342c"/>
  <circle cx="240" cy="860" r="26" fill="#2b4a6f"/>
  <circle cx="320" cy="920" r="16" fill="#e8b620"/>
  <!-- triangle accent -->
  <path d="M 760 430 L 850 560 L 670 560 Z" fill="#8a2f2b"/>
  <!-- wordmark -->
  <text x="700" y="980" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#111111" letter-spacing="12">openSME</text>
</svg>
