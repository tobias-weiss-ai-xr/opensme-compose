# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── Zitadel (Identity & Access Management) ─────────
# Include via: COMPOSE_FILE=docker-compose.yml:idm/zitadel.yml
# Replaces Keycloak. Go-based, no JVM, built-in DB, ~100 MB RAM.
#
# First start: log in at https://auth.<domain>
# Default: zitadel-admin@<domain> / <ZITADEL_ADMIN_PASSWORD>

services:
  zitadel:
    <<: *service-defaults
    image: ${ZITADEL_IMAGE:-ghcr.io/zitadel/zitadel:v4.19.4}
    container_name: opensme-zitadel
    # FQDN hostname: zitadel's SMTP client EHLOs with os.Hostname(); the
    # container-ID default gets rejected by strict relays (stalwart 550).
    hostname: ${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
    restart: unless-stopped
    # Fresh installs need `zitadel init` then
    # `zitadel setup --masterkeyFile /secrets/masterkey --steps /steps.yaml`
    # once before `start` (run headlessly by scripts/demo.sh, CI or the
    # ansible role via `docker compose run`). --steps is REQUIRED for the
    # machine-user/PAT seeding — v4 ignores the ZITADEL_FIRSTINSTANCE_*
    # env fallbacks. The image is distroless — no shell here. TLS is
    # terminated by Traefik (--tlsMode external).
    command: ["start", "--masterkeyFile", "/secrets/masterkey", "--tlsMode", "external"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── Machine ID (sonyflake) ──
      # Private-IP detection fails on newer Docker hosts (unprivileged
      # net.InterfaceAddrs sees no private address) → sonyflake panics with
      # "none of the enabled methods for identifying the machine succeeded".
      # Identify by hostname instead; deterministic in every container runtime.
      ZITADEL_MACHINE_IDENTIFICATION_HOSTNAME_ENABLED: "true"
      ZITADEL_MACHINE_IDENTIFICATION_WEBHOOK_ENABLED: "false"
      # ── Database ──
      # ── External DB (Postgres 17 in docker-compose.yml) ──
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER:-opensme}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-opensme}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_SSLMODE: disable
      # ── External domain ──
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      # System API user (JWT-profile auth) — lets the host manage instance
      # domains (e.g. after a domain rename) via the system API. Key lives in
      # the host .env; never bake a private key into the compose files.
      ZITADEL_SYSTEMAPIUSERS: ${ZITADEL_SYSTEMAPIUSERS:-}
      ZITADEL_EXTERNALPORT: 443
      # tlsMode external: Traefik terminates TLS and forwards plain HTTP to
      # zitadel:8080. Keep ExternalSecure=false so 'zitadel ready' probes
      # http://localhost:8080 (not https, which the server does not speak).
      # Public https URLs are derived from Traefik's X-Forwarded-Proto header.
      ZITADEL_EXTERNALSECURE: false
      # ── First admin ──
      # v3.4 setup keys — setup reads FirstInstance.Org.* (NOT DefaultInstance,
      # which only configures start); the even older USERADMIN_* names are
      # silently ignored, seeding zitadel's built-in default credentials
      # (unknowable ⇒ broken OIDC setup on fresh installs).
      ZITADEL_FIRSTINSTANCE_ORG_NAME: openSME
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL:-admin@${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: openSME
      # must satisfy the default password complexity policy (min 8, upper,
      # lower, digit, symbol) — setup rejects weaker values
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-CHANGEME_zitadel1!}
      # no forced password-change on first login (breaks headless bootstrap)
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      # machine user + PAT for headless automation (Management API); the
      # signed PAT lands in this file at first setup
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /machinekey/machinekey.json
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /machinekey/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: opensme-automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: openSME automation
      # v4 only seeds the PAT when FirstInstance.Org.Machine.Pat is non-nil;
      # the zero date means "never expires"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2038-01-01T00:00:00Z"
      # ── Seeded policies ──
      # setup seeds instance policies from DefaultInstance; keep the
      # symbol requirement OFF so the .env admin password (which may lack
      # symbols) can seed — human passwords created later still follow the
      # runtime policy which admins can tighten
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASSYMBOL: false
    volumes:
      - ./idm/secrets:/secrets:ro
      - zitadel-machinekey:/machinekey
      # setup steps (PAT seeding for the automation machine user) — see
      # idm/zitadel/steps.yaml; passed via `setup --steps /steps.yaml`
      - ./idm/zitadel/steps.yaml:/steps.yaml:ro
      # busybox (extracted by the deploy role) provides a wget for the
      # healthcheck — the distroless image has no shell/http client, and
      # `zitadel ready` insists on an https probe under --tlsMode external
      # (the server only speaks plain HTTP on :8080).
      - ./idm/zitadel/busybox:/usr/local/bin/busybox:ro
    healthcheck:
      # busybox wget honors the host-injected proxy env and would send the
      # probe through a corporate proxy (403 → permanently unhealthy). The
      # env -u prefix makes the probe immune to docker proxy injection.
      test: ["CMD", "/usr/local/bin/busybox", "env", "-u", "http_proxy", "-u", "https_proxy", "-u", "HTTP_PROXY", "-u", "HTTPS_PROXY", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/debug/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.zitadel.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.zitadel.tls=true"
      - "traefik.http.routers.zitadel.entrypoints=websecure"
      # Plain-HTTP twin of the websecure router, internal-only: serves the
      # OIDC userinfo/introspection calls the mail server (Stalwart) makes
      # for webmail SSO token validation. Not published, so nothing outside
      # the compose network can reach :8081.
      - "traefik.http.routers.zitadel-idp.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.zitadel-idp.entrypoints=idpplain"
      # Stalwart dials http://<ZITADEL_DOMAIN>:8081 — the Host header carries
      # the :8081 port, which trips Zitadel's ExternalDomain check (404).
      # Rewrite it to the bare external hostname.
      - "traefik.http.routers.zitadel-idp.middlewares=zitadel-idp-host"
      - "traefik.http.middlewares.zitadel-idp-host.headers.customrequestheaders.Host=${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}"
      - "traefik.http.services.zitadel.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  zitadel-machinekey:
