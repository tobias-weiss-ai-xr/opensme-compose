# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── SOGo Groupware overlay ─────────────────────
# Include via: COMPOSE_FILE=docker-compose.yml:mail/sogo.yml
# Webmail, calendar, contacts (connects to Stalwart IMAP/SMTP).
#
# Config is rendered from sogo.conf.template at startup.
# Required env vars: SOGO_DB_PASSWORD, OPENSME_DOMAIN, TZ,
# ZITADEL_DOMAIN + SOGO_OIDC_CLIENT_ID/SECRET (webmail SSO; minted by
# scripts/zitadel-client.sh --app sogo).

services:
  sogo:
    <<: *service-defaults
    image: ${SOGO_IMAGE:-salvoxia/sogo:latest}
    container_name: opensme-sogo
    restart: unless-stopped
    stop_grace_period: 60s
    extra_hosts:
      # SOGo dials the public IdP hostname server-side (ZITADEL_OIDC_URL
      # discovery + token/userinfo backchannel). Pin it to host-gateway so
      # a docker network alias on the zitadel service can never shadow the
      # FQDN with the zitadel container IP (where only plain :8080 listens
      # — connection refused on :443, exactly the notes SSO outage of
      # 2026-11-13). Same contract as paperless/notes/opencloud.
      - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}:host-gateway"
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      stalwart:
        condition: service_healthy
    volumes:
      # Mount the template to a path OUTSIDE the volume-mounted /etc/sogo:
      # the sogo-config volume is mounted at /etc/sogo and would otherwise
      # shadow this bind (leaving sogo.conf empty). See sogo-entrypoint.sh.
      - ./mail/sogo/sogo.conf.template:/sogo.conf.template:ro
      - ./mail/sogo/sogo-entrypoint.sh:/sogo-entrypoint.sh:ro
      # Trust anchor for SOGo's OIDC backchannel (token/userinfo against
      # https://auth.<domain>): the edge serves the self-signed *.opensme.local
      # lab wildcard; the entrypoint folds it into the system bundle while
      # still running as root (before /start.sh drops privileges).
      - ./traefik/certs/selfsigned.crt:/usr/local/share/ca-certificates/opensme-lab.crt:ro
      - sogo-config:/etc/sogo
      - sogo-data:/srv
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SOGO_DB_PASSWORD: ${SOGO_DB_PASSWORD:?SOGO_DB_PASSWORD must be set in .env}
      OPENSME_DOMAIN: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      # Webmail SSO (docs/ROADMAP.md Epic C3): the OIDC client pair is minted
      # by scripts/zitadel-client.sh --app sogo into .env. Until it runs, the
      # empty defaults render an empty client id and SSO fails loudly at the
      # IdP — by design (no fixed default secret is ever shipped).
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      # OIDC discovery URL — defaults to the Traefik-fronted https URL.
      # Override to http://auth.opensme.local:8080/.well-known/openid-configuration
      # when running without Traefik (e.g. port conflict with sogo6-nginx) so
      # SOGo reaches Zitadel directly via the Docker network alias.
      ZITADEL_OIDC_URL: ${ZITADEL_OIDC_URL:-https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}/.well-known/openid-configuration}
      SOGO_OIDC_CLIENT_ID: ${SOGO_OIDC_CLIENT_ID:-}
      SOGO_OIDC_CLIENT_SECRET: ${SOGO_OIDC_CLIENT_SECRET:-}
      # Bypass corporate HTTP proxy for internal Docker traffic (OIDC to
      # Zitadel, Postgres, memcached, Stalwart). Without this, SOGo routes
      # OIDC discovery through the proxy which can't resolve .opensme.local.
      # To also cover the Docker bridge subnet ranges in proxy environments,
      # set SOGO_NO_PROXY in your .env (gitignored).
      NO_PROXY: ${SOGO_NO_PROXY:-localhost,127.0.0.1,opencloud,traefik,zitadel,.opensme.local}
      no_proxy: ${SOGO_NO_PROXY:-localhost,127.0.0.1,opencloud,traefik,zitadel,.opensme.local}
      # CardDAV backend (carddav) for OpenCloud contacts
      # Primary address book stays in SOGo SQL backend; OpenCloud CardDAV is
      # for shared/team address books. Users can access OpenCloud contacts
      # from the SOGo UI.
      SOGO_CARDDAV_ENABLED: ${SOGO_CARDDAV_ENABLED:-true}
      SOGO_CARDDAV_SERVER: ${SOGO_CARDDAV_SERVER:-https://cloud.${OPENCLOUD_DOMAIN}}
      SOGO_CARDDAV_AUTH_METHODS: ${SOGO_CARDDAV_AUTH_METHODS:-Basic,All}
      SOGO_CARDDAV_REALM: ${SOGO_CARDDAV_REALM:-OpenCloud}
      # CalDAV backend (caldav) for OpenCloud calendars
      # Primary calendar stays in SOGo SQL backend; OpenCloud CalDAV is for
      # shared/team calendars. Users can subscribe to OpenCloud calendars
      # from the SOGo UI.
      SOGO_CALDAV_ENABLED: ${SOGO_CALDAV_ENABLED:-true}
      SOGO_CALDAV_SERVER: ${SOGO_CALDAV_SERVER:-https://cloud.${OPENCLOUD_DOMAIN}}
      SOGO_CALDAV_AUTH_METHODS: ${SOGO_CALDAV_AUTH_METHODS:-Basic,All}
      SOGO_CALDAV_USER_SCRIPT: ${SOGO_CALDAV_USER_SCRIPT:-/usr/lib/GNUstep/SOGo/CALDAVUserScript.sh}
    entrypoint: ["/sogo-entrypoint.sh"]
    command: ["sogod"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20000/SOGo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.sogo.rule=Host(`${SOGO_DOMAIN:-webmail.opensme.graphwiz.ai}`) && PathPrefix(`/SOGo`)"
      - "traefik.http.routers.sogo.tls=true"
      - "traefik.http.routers.sogo.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sogo.entrypoints=websecure"
      # salvoxia/sogo:latest (2026-10) fronts sogod with apache2 on :80;
      # older builds exposed sope directly on :20000 (loopback-only)
      - "traefik.http.services.sogo.loadbalancer.server.port=80"
      # send bare-host requests to the SOGo app root instead of a 404
      - "traefik.http.routers.sogo-root.rule=Host(`${SOGO_DOMAIN:-webmail.opensme.graphwiz.ai}`) && Path(`/`)"
      - "traefik.http.routers.sogo-root.tls=true"
      - "traefik.http.routers.sogo-root.entrypoints=websecure"
      - "traefik.http.routers.sogo-root.middlewares=sogo-root-redirect@docker"
      - "traefik.http.middlewares.sogo-root-redirect.redirectregex.regex=^https?://[^/]+/?$$"
      - "traefik.http.middlewares.sogo-root-redirect.redirectregex.replacement=https://${SOGO_DOMAIN:-webmail.opensme.graphwiz.ai}/SOGo/"
      - "traefik.http.middlewares.sogo-root-redirect.redirectregex.permanent=true"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  sogo-config:
  sogo-data:
