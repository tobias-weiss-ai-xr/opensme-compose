<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} — {{ room }}</title>
  <style>
    :root { --bg:#12161c; --card:#1a2028; --text:#e8ecf2; --dim:#98a2b3;
            --accent:#5b8cff; --danger:#e5484d; --border:#2a323e; --radius:12px; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
    header .t { font-weight: 600; font-size: 14px; }
    header .r { color: var(--dim); font-size: 12px; margin-left: 10px; }
    #status { color: var(--dim); font-size: 12px; }
    #grid { flex: 1; display: grid; gap: 10px; padding: 10px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-content: start; }
    .tile { position: relative; background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9;
            display: grid; place-items: center; }
    .tile video { width: 100%; height: 100%; object-fit: cover; }
    .tile .label { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.55);
                   color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
    .tile .ph { color: var(--dim); font-size: 13px; }
    footer { display: flex; gap: 10px; justify-content: center; padding: 14px;
             background: var(--card); border-top: 1px solid var(--border); }
    footer button { padding: 10px 18px; font-size: 14px; font-weight: 600; color: #fff;
                    border: none; border-radius: 999px; cursor: pointer; background: #2a323e; }
    footer button:hover { filter: brightness(1.2); }
    footer button.off { opacity: .55; }
    footer button.leave { background: var(--danger); }
  </style>
</head>
<body>
  <header>
    <div><span class="t">{{ title }}</span><span class="r">room: {{ room }}</span></div>
    <div id="status">connecting…</div>
  </header>
  <div id="grid"></div>
  <footer>
    <button id="mic">🎤 Mic</button>
    <button id="cam">📷 Camera</button>
    <button id="share">🖥 Share</button>
    <button id="leave" class="leave">Leave</button>
  </footer>
  <script src="/static/livekit-client.umd.min.js"></script>
  <script>
    const SERVER_URL = {{ server_url | tojson }};
    const TOKEN = {{ token | tojson }};
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const btnMic = document.getElementById('mic');
    const btnCam = document.getElementById('cam');
    const btnShare = document.getElementById('share');

    function tile(label, videoEl) {
      const d = document.createElement('div');
      d.className = 'tile';
      if (videoEl) d.appendChild(videoEl);
      else { const p = document.createElement('div'); p.className = 'ph';
             p.textContent = 'camera off'; d.appendChild(p); d.dataset.ph = '1'; }
      const l = document.createElement('div'); l.className = 'label';
      l.textContent = label; d.appendChild(l);
      grid.appendChild(d); return d;
    }
    function attach(participant, videoTrack) {
      let d = grid.querySelector(`[data-identity="${CSS.escape(participant.identity)}"]`);
      if (!d) { d = tile(participant.name || participant.identity, null); d.dataset.identity = participant.identity; }
      if (videoTrack) {
        const old = d.querySelector('video'); if (old) old.remove();
        const el = videoTrack.attach(); el.style.width = '100%'; el.style.height = '100%';
        el.style.objectFit = 'cover'; d.prepend(el);
        const ph = d.querySelector('.ph'); if (ph) ph.remove();
      }
      d.querySelector('.label').textContent = participant.name || participant.identity;
    }
    function detach(participant) {
      const d = grid.querySelector(`[data-identity="${CSS.escape(participant.identity)}"]`);
      if (d) { d.querySelectorAll('video').forEach(v => v.srcObject && v.srcObject.getTracks().forEach(t => t.stop())); d.remove(); }
    }
    function setOff(el, off) { el.classList.toggle('off', off); }

    const room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    room.on(LivekitClient.RoomEvent.Connected, () => {
      status.textContent = 'connected';
      const lp = room.localParticipant;
      attach(lp, lp.getTrackPublication(LivekitClient.Track.Source.Camera)?.videoTrack);
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      status.textContent = 'disconnected — reload to rejoin';
      grid.innerHTML = '';
    });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, p => attach(p, null));
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, p => detach(p));
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      // the event passes the RemoteTrack itself (no .videoTrack wrapper)
      attach(p, track.kind === 'video' ? track : null);
      if (track.kind === 'audio') track.attach();
    });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => track.detach());
    room.on(LivekitClient.RoomEvent.LocalTrackPublished, (pub) => {
      if (pub.videoTrack) attach(room.localParticipant, pub.videoTrack);
    });
    room.on(LivekitClient.RoomEvent.LocalTrackUnpublished, (pub) => {
      if (pub.videoTrack) pub.videoTrack.detach().forEach(v => v.remove());
    });

    (async () => {
      try {
        await room.connect(SERVER_URL, TOKEN);
      } catch (e) {
        status.textContent = 'connection failed: ' + (e.message || e);
        return;
      }
      // start with mic muted, camera on — conservative defaults
      await room.localParticipant.setCameraEnabled(true);
      await room.localParticipant.setMicrophoneEnabled(false);
      setOff(btnMic, true);
    })();

    btnMic.onclick = async () => {
      const want = btnMic.classList.contains('off');
      try { await room.localParticipant.setMicrophoneEnabled(want); setOff(btnMic, !want); }
      catch (e) { status.textContent = 'mic error: ' + (e.message || e); }
    };
    btnCam.onclick = async () => {
      const want = btnCam.classList.contains('off');
      try { await room.localParticipant.setCameraEnabled(want); setOff(btnCam, !want); }
      catch (e) { status.textContent = 'camera error: ' + (e.message || e); }
    };
    btnShare.onclick = async () => {
      const off = btnShare.classList.contains('off');
      try { await room.localParticipant.setScreenShareEnabled(off); setOff(btnShare, !off); }
      catch (e) { status.textContent = 'screen share blocked: ' + (e.message || e); }
    };
    document.getElementById('leave').onclick = () => room.disconnect();
    window.addEventListener('beforeunload', () => { try { room.disconnect(); } catch {} });
  </script>
</body>
</html>
