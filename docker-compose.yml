# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  labels:
    # keep watchtower (host daemon, 04:00 schedule) hands off this stack —
    # versions are pinned/managed in the repo, not by nightly image drift
    - "com.centurylinklabs.watchtower.enable=false"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Core Services
# ═══════════════════════════════════════════════════════════════
# Always runs: Traefik, PostgreSQL (+ PgBouncer), Redis, Memcached, Portal
# Add features via COMPOSE_FILE:
#   idm/zitadel.yml  → Zitadel (IAM/SSO)
#   opencloud/...yml    → OpenCloud (files/collaboration)
#   mail/stalwart.yml   → Stalwart (mail server)
#   mail/sogo.yml       → SOGo (webmail/groupware)
#
# Compose file order matters: base → overlays → profile (last wins).
# ═══════════════════════════════════════════════════════════════

services:
  # ── Reverse Proxy ───────────────────────────
  # Built-in Traefik for standalone deployments. On shared hosts with a
  # system Traefik, use profiles/system-traefik.yml to disable this and
  # connect the portal to the host's traefik-web network instead.
  traefik:
    <<: *service-defaults
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.13}
    container_name: opensme-traefik
    profiles: ["standalone"]
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=opensme-net"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      # Internal-only IdP path for the mail server's OIDC token validation:
      # same external hostname as websecure (so Zitadel's Host check passes)
      # but plain HTTP and NOT published — no client can reach it from outside.
      # See mail/stalwart/config.toml.template [directory.oidc] for why the
      # TLS entrypoint cannot serve this call.
      - "--entryPoints.idpplain.address=:8081"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.http3=true"
      - "--ping=true"
      - "--ping.entryPoint=web"
      - "--certificatesResolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@opensme.graphwiz.ai}"
      # Demo-safe default: LE STAGING. The demo serves .local/.test hosts
      # that LE (rightly) refuses — against production ACME every router
      # (re)configuration fires real orders whose latency storms delay
      # routing readiness (and burn prod rate limits). Set this to
      # https://acme-v02.api.letsencrypt.org/directory in production .env.
      - "--certificatesResolvers.letsencrypt.acme.caServer=${TRAEFIK_ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      - "--certificatesResolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web"
      - "--api.dashboard=true"
      # Secure mode: the dashboard/API is served ONLY via the authenticated
      # router (Host(traefik.<domain>) + basicauth). api.insecure=true would
      # expose an unauthenticated API on :8080 to every container on the
      # network — leave it off.
      - "--api.insecure=false"
      # Rate limiting for 500 users
      # gzip/brotli compression + rate limiting (file provider)
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # Entrypoint middleware chain — repeated-flag form, WEBS ECURE ONLY.
      # Two hard-won lessons:
      # 1. The name-suffixed key form (middlewares.compress@docker=compress)
      #    is silently dropped by traefik's slice parser: `middlewares` is a
      #    LIST, the suffix turns the key into an unknown map path, and NO
      #    middleware gets wired (measured 1875 rps with zero 429s).
      # 2. Entry-level middlewares on :80 are a boot-race hazard: the
      #    @file middlewares load AFTER traefik builds its internal
      #    routers (web-to-websecure redirect, ping healthcheck, acme-http)
      #    — a missing middleware makes traefik DROP the router, so for the
      #    first seconds plain http answered 404 instead of redirecting.
      #    :80 carries only the redirect/acme/ping internals — nothing
      #    worth rate-limiting — so it stays dependency-free. All real
      #    traffic enters via websecure, where the flood budget is
      #    enforced (verified: 1000-request flood → 743×429, zero 5xx).
      - "--entryPoints.websecure.http.middlewares=compress@docker"
      - "--entryPoints.websecure.http.middlewares=ratelimit@file"
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      # CLI healthcheck re-parses the flags it is given (not the daemon's)
      # and HEADs the ping URL of the running daemon — the entrypoint flags
      # must be repeated so it can build the :80 target.
      test: ["CMD", "traefik", "healthcheck", "--ping=true",
             "--ping.entryPoint=web", "--entryPoints.web.address=:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-data:/etc/traefik
    networks:
      opensme-net:
        # opencloud resolves the public IdP/web hostnames to traefik on the
        # docker network (TLS path intact, no /etc/hosts hacks); OC_INSECURE
        # covers the self-signed cert for .local deployments
        aliases:
          - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}"
          - "${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}"
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.middlewares=auth"
      # Compression middleware (file provider config in traefik-data)
      - "traefik.http.middlewares.compress.compress=true"
      # NOTE: Set TRAEFIK_USERS to a valid htpasswd entry (htpasswd -nb user pass)
      #       Default placeholder will reject all requests — change before using.
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_USERS:-admin:$$apr1$$CHANGEME}"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ── Database ─────────────────────────────────
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: opensme-postgres
    restart: unless-stopped
    stop_grace_period: 120s
    shm_size: 256M
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME_postgres}
      POSTGRES_USER: opensme
      POSTGRES_DB: opensme
      # Per-service DB passwords for postgres-init/01-create-users.sh —
      # initdb scripts run INSIDE this container and only see env passed
      # here (the script's :-changeme fallbacks otherwise win, and the
      # profile-gated service then fails auth against a 'changeme' user).
      # Defaults aligned with the per-service compose files (e.g.
      # services/paperless.yml uses ${PAPERLESS_DB_PASSWORD:-CHANGEME_paperless}).
      # If these defaults diverge, postgres-init creates the user with one
      # password and the service tries to connect with another → auth failure.
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:-CHANGEME_casdoor}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:-CHANGEME_synapse}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD:-CHANGEME_paperless}
      INVOICENINJA_DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:-CHANGEME_invoiceninja}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:-CHANGEME_notes}
      NOSDESK_DB_PASSWORD: ${NOSDESK_DB_PASSWORD:-CHANGEME_nosdesk_db}
      CAMUNDA_DB_PASSWORD: ${CAMUNDA_DB_PASSWORD:-CHANGEME_camunda}
      # SOGo (mail/sogo.yml) connects as sogo_user, not as the superuser —
      # its DB password is generated separately from POSTGRES_PASSWORD.
      SOGO_DB_PASSWORD: ${SOGO_DB_PASSWORD:-CHANGEME_sogo}
    # Production tuning for up to 500 users (via CLI args)
    command:
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "bgwriter_lru_maxpages=200"
      - "-c"
      - "autovacuum_work_mem=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensme"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  # ── Connection Pool (PgBouncer) ─────────────
  pgbouncer:
    <<: *service-defaults
    image: ${PGBOUNCER_IMAGE:-bitnamilegacy/pgbouncer:latest}
    container_name: opensme-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: opensme
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME_postgres}
      POSTGRESQL_DATABASE: opensme
      # bitnami uses PGBOUNCER_DATABASE as the client-facing [databases]
      # alias; unset it defaults to "postgres" and every -d opensme
      # connection (incl. the healthcheck) fails with "no such database".
      PGBOUNCER_DATABASE: opensme
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGEME_postgres}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_MAX_DB_CONNECTIONS: 50
      PGBOUNCER_MAX_USER_CONNECTIONS: 50
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 6432 -U opensme -d opensme -w -c \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Cache ────────────────────────────────────
  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:alpine}
    container_name: opensme-redis
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --save 300 100
      - --save 60 10000
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 2gb
      - --maxmemory-policy allkeys-lru
      - --lazyfree-lazy-eviction yes
      - --lazyfree-lazy-expire yes
      - --loglevel notice
    volumes:
      - redis-data:/data
    environment:
      # for the healthcheck only (no AUTH warning noise)
      - REDIS_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  memcached:
    <<: *service-defaults
    image: ${MEMCACHED_IMAGE:-memcached:alpine}
    container_name: opensme-memcached
    restart: unless-stopped
    command: memcached -m 2048 -c 4096 -t 4
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Rust Portal ─────────────────────────────
  portal:
    <<: *service-defaults
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: opensme-portal
    restart: unless-stopped
    volumes:
      - portal-data:/data
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}
      OPENSME_DOMAIN: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      INTERCOM_DATA_PATH: ${INTERCOM_DATA_PATH:-/data/intercom.json}
      POLLS_ENABLED: ${POLLS_ENABLED:-}
      POLLS_DATA_PATH: ${POLLS_DATA_PATH:-/data/polls.json}
      CLOUD_WEBDAV_URL: ${CLOUD_WEBDAV_URL:-}
      CLOUD_WEBDAV_USER: ${CLOUD_WEBDAV_USER:-}
      CLOUD_WEBDAV_PASS: ${CLOUD_WEBDAV_PASS:-}
      CLOUD_SHARE_URL: ${CLOUD_SHARE_URL:-}
      OPENCLOUD_URL: https://${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}
      MAIL_URL: ${MAIL_URL:-}
      IDP_URL: https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      TICKETING_URL: ${TICKETING_URL:-}
      CMS_URL: ${CMS_URL:-}
      SHOP_URL: ${SHOP_URL:-}
      BPM_URL: ${BPM_URL:-}
      INVOICE_URL: ${INVOICE_URL:-}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      CHAT_URL: ${CHAT_URL:-}
      NOTES_URL: ${NOTES_URL:-}
      SURVEYS_URL: ${SURVEYS_URL:-}
      PORTAL_ANNOUNCEMENTS: ${PORTAL_ANNOUNCEMENTS:-}
      HTTPS_PROXY: ${PORTAL_HTTPS_PROXY:-}
      PORTAL_NO_PROXY: ${PORTAL_NO_PROXY:-}
      PORTAL_FEEDS: ${PORTAL_FEEDS:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      INTERCOM_ATTACHMENT_HOSTS: ${INTERCOM_ATTACHMENT_HOSTS:-}
      INTERCOM_ALLOW_HTTP: ${INTERCOM_ALLOW_HTTP:-}
      RUST_LOG: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.portal.rule=Host(`${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.services.portal.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  # ── Next.js Portal Web UI ─────────────────────────
  # Frontend in front of the Rust API (portal service). Rendered with Next.js
  # 15 in openEduSuite style; every /api|/health|/metrics request is proxied
  # to `portal` same-origin by route handlers. Opt-in via the `web` profile:
  # the demo set (no profile) keeps the Rust-served page, the live chain
  # enables `web` and traefik routes Host(portal) here (priority 10 > 0).
  portal-web:
    <<: *service-defaults
    profiles: ["web"]
    read_only: true
    tmpfs:
      - /tmp
    # non-root node process — needs no capabilities at all (binds :3000)
    cap_drop:
      - ALL
    build:
      context: ./portal/web
      dockerfile: Dockerfile
    container_name: opensme-portal-web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://portal:8080
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}
      OPENSME_DOMAIN: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      OPENCLOUD_URL: https://${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}
      MAIL_URL: ${MAIL_URL:-}
      IDP_URL: https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      TICKETING_URL: ${TICKETING_URL:-}
      CMS_URL: ${CMS_URL:-}
      SHOP_URL: ${SHOP_URL:-}
      BPM_URL: ${BPM_URL:-}
      INVOICE_URL: ${INVOICE_URL:-}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      CHAT_URL: ${CHAT_URL:-}
      NOTES_URL: ${NOTES_URL:-}
      SURVEYS_URL: ${SURVEYS_URL:-}
      PORTAL_ANNOUNCEMENTS: ${PORTAL_ANNOUNCEMENTS:-}
      PORTAL_FEEDS: ${PORTAL_FEEDS:-}
      AI_API_URL: ${AI_API_URL:-}
      POLLS_ENABLED: ${POLLS_ENABLED:-}
      # Portal sign-in for the authenticated surfaces (intercom/polls):
      # HMAC session key + the OIDC RP client registered by
      # scripts/zitadel-client.sh --app portal (rotation path: demo/demo-live).
      LOGIN_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:-}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.portal-web.rule=Host(`${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.portal-web.priority=10"
      - "traefik.http.routers.portal-web.tls=true"
      - "traefik.http.routers.portal-web.entrypoints=websecure"
      - "traefik.http.services.portal-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  opensme-net:
    name: opensme-net
    driver: bridge

volumes:
  traefik-data:
  postgres-data:
  redis-data:
  portal-data:
