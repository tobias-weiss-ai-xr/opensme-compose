# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  labels:
    # keep watchtower (host daemon, 04:00 schedule) hands off this stack —
    # versions are pinned/managed in the repo, not by nightly image drift
    - "com.centurylinklabs.watchtower.enable=false"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Core Services
# ═══════════════════════════════════════════════════════════════
# Always runs: Traefik, PostgreSQL (+ PgBouncer), Redis, Memcached, Portal
# Add features via COMPOSE_FILE:
#   idm/zitadel.yml  → Zitadel (IAM/SSO)
#   opencloud/...yml    → OpenCloud (files/collaboration)
#   mail/stalwart.yml   → Stalwart (mail server)
#   mail/sogo.yml       → SOGo (webmail/groupware)
#
# Compose file order matters: base → overlays → profile (last wins).
# ═══════════════════════════════════════════════════════════════

services:
  # ── Reverse Proxy ───────────────────────────
  # Built-in Traefik for standalone deployments. On shared hosts with a
  # system Traefik, use profiles/system-traefik.yml to disable this and
  # connect the portal to the host's traefik-web network instead.
  traefik:
    <<: *service-defaults
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.13}
    container_name: opensme-traefik
    profiles: ["standalone"]
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=opensme-net"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      # Internal-only IdP path for the mail server's OIDC token validation:
      # same external hostname as websecure (so Zitadel's Host check passes)
      # but plain HTTP and NOT published — no client can reach it from outside.
      # See mail/stalwart/config.toml.template [directory.oidc] for why the
      # TLS entrypoint cannot serve this call.
      - "--entryPoints.idpplain.address=:8081"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.http3=true"
      - "--ping=true"
      - "--ping.entryPoint=web"
      - "--certificatesResolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@opensme.graphwiz.ai}"
      # Demo-safe default: LE STAGING. The demo serves .local/.test hosts
      # that LE (rightly) refuses — against production ACME every router
      # (re)configuration fires real orders whose latency storms delay
      # routing readiness (and burn prod rate limits). Set this to
      # https://acme-v02.api.letsencrypt.org/directory in production .env.
      - "--certificatesResolvers.letsencrypt.acme.caServer=${TRAEFIK_ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      - "--certificatesResolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web"
      - "--api.dashboard=true"
      # Secure mode: the dashboard/API is served ONLY via the authenticated
      # router (Host(traefik.<domain>) + basicauth). api.insecure=true would
      # expose an unauthenticated API on :8080 to every container on the
      # network — leave it off.
      - "--api.insecure=false"
      # Rate limiting for 500 users
      # gzip/brotli compression + rate limiting (file provider)
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # Entrypoint middleware chain — repeated-flag form, WEBS ECURE ONLY.
      # Two hard-won lessons:
      # 1. The name-suffixed key form (middlewares.compress@docker=compress)
      #    is silently dropped by traefik's slice parser: `middlewares` is a
      #    LIST, the suffix turns the key into an unknown map path, and NO
      #    middleware gets wired (measured 1875 rps with zero 429s).
      # 2. Entry-level middlewares on :80 are a boot-race hazard: the
      #    @file middlewares load AFTER traefik builds its internal
      #    routers (web-to-websecure redirect, ping healthcheck, acme-http)
      #    — a missing middleware makes traefik DROP the router, so for the
      #    first seconds plain http answered 404 instead of redirecting.
      #    :80 carries only the redirect/acme/ping internals — nothing
      #    worth rate-limiting — so it stays dependency-free. All real
      #    traffic enters via websecure, where the flood budget is
      #    enforced (verified: 1000-request flood → 743×429, zero 5xx).
      - "--entryPoints.websecure.http.middlewares=compress@docker"
      - "--entryPoints.websecure.http.middlewares=ratelimit@file"
      - "--entryPoints.websecure.http.middlewares=hsts@file"
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      # CLI healthcheck re-parses the flags it is given (not the daemon's)
      # and HEADs the ping URL of the running daemon — the entrypoint flags
      # must be repeated so it can build the :80 target.
      test: ["CMD", "traefik", "healthcheck", "--ping=true",
             "--ping.entryPoint=web", "--entryPoints.web.address=:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Lab wildcard (*.opensme.local, self-signed, committed fixture) served
      # as the default cert for vhosts without an ACME resolver — see
      # traefik/dynamic.yml tls block. Services that verify TLS against the
      # edge (paperless allauth, SOGo) mount the same file as trust anchor.
      - ./traefik/certs:/etc/traefik/certs:ro
      - traefik-data:/etc/traefik
    networks:
      opensme-net:
        # opencloud resolves the public IdP/web hostnames to traefik on the
        # docker network (TLS path intact, no /etc/hosts hacks); OC_INSECURE
        # covers the self-signed cert for .local deployments
        aliases:
          - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}"
          - "${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}"
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${OPENSME_DOMAIN:-opensme.graphwiz.ai}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.middlewares=auth"
      # Compression middleware (file provider config in traefik-data)
      - "traefik.http.middlewares.compress.compress=true"
      # NOTE: Set TRAEFIK_USERS to a valid htpasswd entry (htpasswd -nb user pass)
      #       Default placeholder will reject all requests — change before using.
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_USERS:-admin:$$apr1$$CHANGEME}"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ── Database ─────────────────────────────────
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: opensme-postgres
    restart: unless-stopped
    stop_grace_period: 120s
    shm_size: 256M
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: opensme
      POSTGRES_DB: opensme
      # Per-service DB passwords for postgres-init/01-create-users.sh —
      # initdb scripts run INSIDE this container and only see env passed
      # here (the script's :-changeme fallbacks otherwise win, and the
      # profile-gated service then fails auth against a 'changeme' user).
      # Defaults aligned with the per-service compose files (e.g.
      # services/paperless.yml requires PAPERLESS_DB_PASSWORD (fail-fast, no known default).
      # If these defaults diverge, postgres-init creates the user with one
      # password and the service tries to connect with another → auth failure.
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:?CASDOOR_DB_PASSWORD must be set in .env}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?SYNAPSE_DB_PASSWORD must be set in .env}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD:?PAPERLESS_DB_PASSWORD must be set in .env}
      INVOICENINJA_DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:?INVOICENINJA_DB_PASSWORD must be set in .env}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:?NOTES_DB_PASSWORD must be set in .env}
      NOSDESK_DB_PASSWORD: ${NOSDESK_DB_PASSWORD:?NOSDESK_DB_PASSWORD must be set in .env}
      CAMUNDA_DB_PASSWORD: ${CAMUNDA_DB_PASSWORD:?CAMUNDA_DB_PASSWORD must be set in .env}
      # SOGo (mail/sogo.yml) connects as sogo_user, not as the superuser —
      # its DB password is generated separately from POSTGRES_PASSWORD.
      SOGO_DB_PASSWORD: ${SOGO_DB_PASSWORD:?SOGO_DB_PASSWORD must be set in .env}
    # Production tuning for up to 500 users (via CLI args)
    command:
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "bgwriter_lru_maxpages=200"
      - "-c"
      - "autovacuum_work_mem=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensme"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  # ── Connection Pool (PgBouncer) ─────────────
  pgbouncer:
    <<: *service-defaults
    image: ${PGBOUNCER_IMAGE:-bitnamilegacy/pgbouncer:latest}
    container_name: opensme-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: opensme
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRESQL_DATABASE: opensme
      # bitnami uses PGBOUNCER_DATABASE as the client-facing [databases]
      # alias; unset it defaults to "postgres" and every -d opensme
      # connection (incl. the healthcheck) fails with "no such database".
      PGBOUNCER_DATABASE: opensme
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_MAX_DB_CONNECTIONS: 50
      PGBOUNCER_MAX_USER_CONNECTIONS: 50
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 6432 -U opensme -d opensme -w -c \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Cache ────────────────────────────────────
  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:alpine}
    container_name: opensme-redis
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --save 300 100
      - --save 60 10000
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 2gb
      - --maxmemory-policy allkeys-lru
      - --lazyfree-lazy-eviction yes
      - --lazyfree-lazy-expire yes
      - --loglevel notice
    volumes:
      - redis-data:/data
    environment:
      # for the healthcheck only (no AUTH warning noise)
      - REDIS_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  memcached:
    <<: *service-defaults
    image: ${MEMCACHED_IMAGE:-memcached:alpine}
    container_name: opensme-memcached
    restart: unless-stopped
    command: memcached -m 2048 -c 4096 -t 4
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - opensme-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Rust Portal ─────────────────────────────
  portal:
    <<: *service-defaults
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    build:
      # root context: portal depends on ../services/rust-webdav-client
      context: .
      dockerfile: portal/Dockerfile
    container_name: opensme-portal
    restart: unless-stopped
    volumes:
      - portal-data:/data
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}
      OPENSME_DOMAIN: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      INTERCOM_DATA_PATH: ${INTERCOM_DATA_PATH:-/data/intercom.json}
      POLLS_ENABLED: ${POLLS_ENABLED:-}
      POLLS_DATA_PATH: ${POLLS_DATA_PATH:-/data/polls.json}
      CLOUD_WEBDAV_URL: ${CLOUD_WEBDAV_URL:-}
      CLOUD_WEBDAV_USER: ${CLOUD_WEBDAV_USER:-}
      CLOUD_WEBDAV_PASS: ${CLOUD_WEBDAV_PASS:-}
      CLOUD_SHARE_URL: ${CLOUD_SHARE_URL:-}
      OPENCLOUD_URL: https://${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}
      MAIL_URL: ${MAIL_URL:-}
      IDP_URL: https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      TICKETING_URL: ${TICKETING_URL:-}
      CMS_URL: ${CMS_URL:-}
      SHOP_URL: ${SHOP_URL:-}
      BPM_URL: ${BPM_URL:-}
      INVOICE_URL: ${INVOICE_URL:-}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      CHAT_URL: ${CHAT_URL:-}
      NOTES_URL: ${NOTES_URL:-}
      SURVEYS_URL: ${SURVEYS_URL:-}
      CALENDAR_URL: ${CALENDAR_URL:-}
      VC_URL: ${VC_URL:-}
      PORTAL_ANNOUNCEMENTS: ${PORTAL_ANNOUNCEMENTS:-}
      HTTPS_PROXY: ${PORTAL_HTTPS_PROXY:-}
      PORTAL_NO_PROXY: ${PORTAL_NO_PROXY:-}
      PORTAL_FEEDS: ${PORTAL_FEEDS:-}
      # Compose-internal targets must bypass the corporate proxy: the portal
      # inherits http_proxy/https_proxy/no_proxy from .env, and reqwest
      # routes http://zitadel:8080 through the HRZ Squid → 503 (it cannot
      # resolve compose bridge names). reqwest reads NO_PROXY from the env,
      # so list the bridge hostnames here (no CIDR literals — the
      # secret-scanner flags RFC1918 addresses in compose files). Without
      # this the IDP_INTERNAL_URL token exchange fails on soho/medium/max
      # deployments (callback 302, no OPENSMEPORTALSESSION cookie).
      NO_PROXY: ${PORTAL_NO_PROXY:-localhost,127.0.0.1,zitadel,traefik,opencloud,opensme.local,opensme.graphwiz.ai}
      no_proxy: ${PORTAL_NO_PROXY:-localhost,127.0.0.1,zitadel,traefik,opencloud,opensme.local,opensme.graphwiz.ai}
      # Server-side OIDC base (token + userinfo exchange): the IdP on the
      # compose network is reached at http://zitadel:8080; the public https
      # URL fails reqwest's TLS verification behind the self-signed edge.
      # Previously only profiles/demo.dev.yml set this — a gap that broke
      # portal sign-in on soho/medium/max deployments (callback 302, no
      # OPENSMEPORTALSESSION cookie). Override with an empty value when a
      # trusted TLS certificate is in front of the IdP.
      IDP_INTERNAL_URL: ${IDP_INTERNAL_URL:-http://zitadel:8080}
      # Portal sign-in for the authenticated surfaces (intercom/polls): the
      # Rust backend validates OPENSMEPORTALSESSION itself, so it needs the
      # same OIDC RP env as portal-web — without it the auth gate can never
      # open on a compose-deployed stack (demo/CI), only on the ansible
      # deployment. Fail-closed when unset (session.enabled() stays false).
      LOGIN_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:?}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:?}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:?}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      INTERCOM_ATTACHMENT_HOSTS: ${INTERCOM_ATTACHMENT_HOSTS:-}
      INTERCOM_ALLOW_HTTP: ${INTERCOM_ALLOW_HTTP:-}
      RUST_LOG: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.portal.rule=Host(`${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.services.portal.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  # ── Next.js Portal Web UI ─────────────────────────
  # Frontend in front of the Rust API (portal service). Rendered with Next.js
  # 15 in openEduSuite style; every /api|/health|/metrics request is proxied
  # to `portal` same-origin by route handlers. Opt-in via the `web` profile:
  # the demo set (no profile) keeps the Rust-served page, the live chain
  # enables `web` and traefik routes Host(portal) here (priority 10 > 0).
  portal-web:
    <<: *service-defaults
    profiles: ["web"]
    read_only: true
    tmpfs:
      - /tmp
    # non-root node process — needs no capabilities at all (binds :3000)
    cap_drop:
      - ALL
    build:
      context: ./portal/web
      dockerfile: Dockerfile
    container_name: opensme-portal-web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://portal:8080
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}
      OPENSME_DOMAIN: ${OPENSME_DOMAIN:-opensme.graphwiz.ai}
      OPENCLOUD_URL: https://${OPENCLOUD_DOMAIN:-cloud.opensme.graphwiz.ai}
      MAIL_URL: ${MAIL_URL:-}
      IDP_URL: https://${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}
      TICKETING_URL: ${TICKETING_URL:-}
      CMS_URL: ${CMS_URL:-}
      SHOP_URL: ${SHOP_URL:-}
      BPM_URL: ${BPM_URL:-}
      INVOICE_URL: ${INVOICE_URL:-}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      CHAT_URL: ${CHAT_URL:-}
      NOTES_URL: ${NOTES_URL:-}
      SURVEYS_URL: ${SURVEYS_URL:-}
      CALENDAR_URL: ${CALENDAR_URL:-}
      VC_URL: ${VC_URL:-}
      PORTAL_ANNOUNCEMENTS: ${PORTAL_ANNOUNCEMENTS:-}
      PORTAL_FEEDS: ${PORTAL_FEEDS:-}
      AI_API_URL: ${AI_API_URL:-}
      POLLS_ENABLED: ${POLLS_ENABLED:-}
      # Portal sign-in for the authenticated surfaces (intercom/polls):
      # HMAC session key + the OIDC RP client registered by
      # scripts/zitadel-client.sh --app portal (rotation path: demo/demo-live).
      LOGIN_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:-}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.http.routers.portal-web.rule=Host(`${PORTAL_DOMAIN:-home.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.portal-web.priority=10"
      - "traefik.http.routers.portal-web.tls=true"
      - "traefik.http.routers.portal-web.entrypoints=websecure"
      - "traefik.http.services.portal-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ═══════════════════════════════════════════════════════════════
  # Public Calendar (adopted into the core stack: calrs booking +
  # dedicated Radicale CalDAV) — was opt-in overlay services/calendar.yml,
  # adopted 2026-11-07 as a first-class part of openSME-compose.
  # calrs: self-hosted booking calendar (CalDAV-backed availability,
  # booking pages, video-consultation slots) — edge-routed at
  # calendar.<domain>. calendar-radicale: its dedicated CalDAV store,
  # INTERNAL-ONLY (no Traefik labels) — calrs reaches it over
  # opensme-net at http://calendar-radicale:5232/; never exposed at the
  # edge. Bootstrap: scripts/calendar-setup.sh seeds the Radicale
  # htpasswd (RADICALE_USER/RADICALE_PASSWORD) and brings the stack up.
  # Register the calrs admin in the web UI — the FIRST registered user
  # becomes admin (CALRS_ADMIN_EMAIL / CALRS_ADMIN_PASSWORD). The calrs
  # image is ALWAYS built from the pinned upstream tag at deploy time
  # (images/calrs/README.md).
  # ═══════════════════════════════════════════════════════════════
  calendar:
    <<: *service-defaults
    # Opt-in profile: calrs ships no registry image and the source tree is
    # not vendored here, so the image must be built once from the pinned
    # upstream checkout before this profile can start (see
    # images/calrs/README.md). Keeping it out of the default profile is what
    # lets `docker compose up --build` work on a fresh clone and in CI.
    profiles: ["calendar"]
    image: calrs:${CALRS_IMAGE_TAG:-1.6.0}
    container_name: opensme-calendar
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # real calrs env (upstream README) — absolute base for booking
      # links rendered in pages/emails; must match the public host
      CALRS_BASE_URL: https://${CALENDAR_DOMAIN:-calendar.opensme.graphwiz.ai}
      # single-file SQLite home (WAL mode, zero external deps)
      CALRS_DATA_DIR: /var/lib/calrs
      # OIDC SSO block. LIVE on the demo deployment: calrs 1.6.0 stores the
      # OIDC client in its SQLite auth_config (admin panel / POST
      # /dashboard/admin/oidc), NOT in env — these passthrough envs only feed
      # a patched/bumped calrs. The Zitadel compat patch
      # (images/calrs/patches/0001-oidc-zitadel-compat.patch) adds multi-aud
      # ID-token acceptance + userinfo fallback so SSO works with Zitadel.
      CALRS_OIDC_ISSUER: ${CALRS_OIDC_ISSUER:-}
      CALRS_OIDC_CLIENT_ID: ${CALRS_OIDC_CLIENT_ID:-}
      CALRS_OIDC_CLIENT_SECRET: ${CALRS_OIDC_CLIENT_SECRET:-}
      CALRS_OIDC_REDIRECT_URI: https://${CALENDAR_DOMAIN:-calendar.opensme.graphwiz.ai}/auth/oidc/callback
      # Self-hosted video (LiveKit) origin for the event-type form's
      # "Use self-hosted video" helper (patch 0003): fills the location
      # field with {VC}/room/{uid} — a per-booking room link, so nobody
      # copies/pastes a URL. Fallbacks: env VC_URL.
      CALRS_VC_URL: ${CALRS_VC_URL:-}
    # calrs OIDC discovery/token exchange must reach the IdP without
    # leaving the host (container egress is blocked in constrained
    # deployments): map the IdP name to the host-gateway so traffic
    # rides traefik :443 (valid cert, SNI-routed to zitadel) — the same
    # pattern as the paperless OIDC sidecar (services/paperless.yml).
    # NOTE calrs 1.6.0 stores the OIDC client in its SQLite auth_config
    # (admin panel), not in these envs — enable via dashboard → admin →
    # OIDC or POST /dashboard/admin/oidc with an admin session.
    extra_hosts:
      - "${ZITADEL_DOMAIN:-auth.opensme.graphwiz.ai}:host-gateway"
    depends_on:
      calendar-radicale:
        condition: service_healthy
    volumes:
      - calrs-data:/var/lib/calrs
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calendar.rule=Host(`${CALENDAR_DOMAIN:-calendar.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.calendar.tls=true"
      - "traefik.http.routers.calendar.tls.certresolver=letsencrypt"
      - "traefik.http.routers.calendar.entrypoints=websecure"
      - "traefik.http.services.calendar.loadbalancer.server.port=3000"
    healthcheck:
      # curl is baked into the vendored image (images/calrs delta);
      # calrs has no /health route — any HTTP status proves the process
      # answers (no -f on purpose)
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  calendar-radicale:
    <<: *service-defaults
    # Same opt-in profile as `calendar` — the internal CalDAV store is only
    # useful together with calrs (scripts/calendar-setup.sh brings both up).
    profiles: ["calendar"]
    image: tomsquest/docker-radicale:${RADICALE_IMAGE_TAG:-3.9.0.0}
    container_name: opensme-calendar-radicale
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # tomsquest image config mechanism: every RADICALE_CONFIG_<SECTION>_<KEY>
      # var is merged into /config/config by the image entrypoint at start.
      # Internal-only CalDAV store for calrs (booking login, htpasswd auth).
      RADICALE_CONFIG_AUTH_TYPE: htpasswd
      # /config/users is seeded by scripts/calendar-setup.sh from
      # RADICALE_USER/RADICALE_PASSWORD (the booking CalDAV login)
      RADICALE_CONFIG_AUTH_HTPASSWD_FILENAME: /config/users
      # switch to plain if scripts/calendar-setup.sh had no htpasswd(1)
      RADICALE_CONFIG_AUTH_HTPASSWD_ENCRYPTION: ${RADICALE_AUTH_HTPASSWD_ENCRYPTION:-bcrypt}
      # collection root inside the radicale-data volume; per-user
      # auto-creation on first authenticated DAV request is Radicale 3
      # default behavior
      RADICALE_CONFIG_STORAGE_FILESYSTEM_FOLDER: /data/collections
    volumes:
      # image default config is copied into the empty named volume on
      # first mount; the env block above rewrites it at every start
      - radicale-config:/config
      - radicale-data:/data
    networks:
      # Pinned IP so internal CalDAV clients whose URL validator requires a
      # dotted host or IP literal (sogo6 external-calendar marshmallow
      # fields.Url rejects TLD-less names like "calendar-radicale") can
      # subscribe via http://172.19.0.250:5232/… without an edge route.
      opensme-net:
        ipv4_address: 172.19.0.250
    labels:
      # Read-only-at-the-edge CalDAV view of the PUBLIC BOOKING store, so
      # groupware clients (sogo6 external calendar, source_type=caldav)
      # can subscribe over HTTPS — sogo6's IcsFetcher is https-only and
      # rejects private IPs (SSRF guard), so the internal name/IP is not
      # usable from a client. Privacy contract unchanged: this store holds
      # ONLY public bookings (never staff/SOGo calendars), and Radicale's
      # own htpasswd auth still applies on top of the edge route.
      - "traefik.enable=true"
      - "traefik.http.routers.calendar-dav.rule=Host(`${CALENDAR_DOMAIN:-calendar.opensme.graphwiz.ai}`) && PathPrefix(`/dav`)"
      - "traefik.http.routers.calendar-dav.tls=true"
      - "traefik.http.routers.calendar-dav.tls.certresolver=letsencrypt"
      - "traefik.http.routers.calendar-dav.entrypoints=websecure"
      - "traefik.http.routers.calendar-dav.priority=10010"
      - "traefik.http.middlewares.calendar-dav-strip.stripprefix.prefixes=/dav"
      - "traefik.http.routers.calendar-dav.middlewares=calendar-dav-strip"
      - "traefik.http.services.calendar-dav.loadbalancer.server.port=5232"
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      # the image ships curl; no --fail — with htpasswd auth the root
      # path answers 401 and ANY HTTP status proves the server is up
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://127.0.0.1:5232/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── VC (LiveKit) ────────────────────────────────────────────────────
  # Self-hosted video meetings: the SFU below + the minimal token-mint/
  # room UI (vc-room). Public surface: $VC_DOMAIN (room UI + /rtc and
  # /twirp signaling via the fleet edge). Media uses the single-port
  # UDP mux (rtc.udp_port — port_range_* intentionally unset) and the
  # ICE/TCP fallback so only TWO host ports are ever opened. The
  # container cannot do STUN (no runtime egress): NODE_IP advertises
  # the public IP deterministically instead of use_external_ip.
  # HOST NETWORKING (LiveKit's recommended docker mode): this host is
  # OpenVZ — UDP into bridge/veth containers is dead (same kernel quirk
  # as host→container TCP flakiness) and the nat table has no DNAT
  # support, so bridge mode cannot carry WebRTC media. On the host
  # netns the SFU binds 7880/7881/7882 directly; publish them in the
  # host firewall (ufw allow 7881/tcp, 7882/udp). Signaling rides the
  # edge via a static traefik file service → http://127.0.0.1:7880.
  vc-livekit:
    <<: *service-defaults
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-v1.13.11}
    container_name: opensme-vc-livekit
    restart: unless-stopped
    profiles: ["vc"]
    # host netns: 7880 (signaling, loopback-only via edge), 7881/tcp
    # (ICE fallback), 7882/udp (media mux) — no docker port publishing
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # signaling/API — behind the TLS-terminating edge (no LB needed,
      # single node); /rtc + /twirp are proxied, everything else isn't
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${VC_TCP_PORT:-7881}
          udp_port: ${VC_UDP_PORT:-7882}
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      # no container egress -> STUN is unreachable; pin the advertised
      # IP instead (CLI flag --node-ip has the NODE_IP env form). With
      # host networking the public IP is visible on the interface, but
      # pinning keeps the advertised address deterministic.
      NODE_IP: ${VC_PUBLIC_IP:?set VC_PUBLIC_IP}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      # NO traefik docker labels on purpose: host-networked containers
      # are routed from the fleet edge via a static file service
      # (dynamic/routers.yml -> http://127.0.0.1:7880), same file-router
      # pattern as the calendar/vc edge. Repo-local traefik users: point
      # your edge at 127.0.0.1:${VC_TCP_PORT... port 7880} similarly.
    healthcheck:
      # image ships busybox/wget; the signaling port answers a plain
      # `GET /` with 200 "OK" — no auth, no special route needed
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  vc-room:
    <<: *service-defaults
    # local build — our minimal token-mint + room UI (no registry image)
    image: vc-room:${VC_ROOM_IMAGE_TAG:-1.0.0}
    build:
      context: ./images/vc-room
    container_name: opensme-vc-room
    restart: unless-stopped
    profiles: ["vc"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # flask needs no root; python-slim ships setuid binaries which the
    # static suite flags against cap_drop: ALL — run unprivileged instead
    user: "1000:1000"
    depends_on:
      vc-livekit:
        condition: service_started
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # browser-facing signaling base (public, TLS at the edge) — NO
      # /rtc path: livekit-client appends /rtc itself
      LIVEKIT_URL: wss://${VC_DOMAIN:-vc.opensme.graphwiz.ai}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      VC_TITLE: ${VC_TITLE:-openSME Meet}
    networks:
      - opensme-net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.services.vc-room.loadbalancer.server.port=8090"
      - "traefik.http.routers.vc-room.rule=Host(`${VC_DOMAIN:-vc.opensme.graphwiz.ai}`)"
      - "traefik.http.routers.vc-room.entrypoints=websecure"
      - "traefik.http.routers.vc-room.tls=true"
      - "traefik.http.routers.vc-room.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vc-room.priority=10000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  opensme-net:
    name: opensme-net
    driver: bridge
    # Pinned so the static service addresses resolve: opencloud uses
    # 172.19.0.17 (CSP frame-src for cloud.*) and the external-Traefik
    # profile pins calendar-radicale to 172.19.0.250. Without an explicit
    # subnet Docker picks an arbitrary free range, and `up` then dies with
    # "no configured subnet contains IP address 172.19.0.17" — which is
    # exactly what broke the demo/E2E CI boot.
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  traefik-data:
  postgres-data:
  redis-data:
  portal-data:
  calrs-data:
  radicale-config:
  radicale-data:
