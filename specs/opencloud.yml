# ═══════════════════════════════════════════════════════════════
# specs/opencloud.yml — File sync, collaboration, S3 storage
# ═══════════════════════════════════════════════════════════════

services:
  opencloud:
    image: opencloudeu/opencloud-rolling:8.0.1
    compose_file: opencloud/opencloud.yml
    required: false
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    volumes:
      - opencloud-config:/etc/opencloud
      - opencloud-data:/var/lib/opencloud
    env:
      - OPENCLOUD_DOMAIN
      - OC_ADMIN_USERNAME
      - OC_ADMIN_PASSWORD
      - OC_OIDC_CLIENT_ID       # Zitadel-minted, persisted by scripts/zitadel-client.sh
      - OC_OIDC_CLIENT_SECRET   # canonical key (OC_OIDC_SECRET kept as legacy alias only)
      - OC_S3_ENDPOINT
      - OC_S3_ACCESS_KEY
      - OC_S3_SECRET_KEY
      - NOTIFICATIONS_SMTP_SENDER
    traefik_labels: true
    resource_limits:
      memory: 4G

  collabora:
    image: ${COLLABORA_IMAGE:-collabora/code:latest}
    compose_file: opencloud/opencloud.yml
    required: false
    host_ports: []
    # collabora/code 26.04 ships no curl/wget/shell — in-container health-
    # checks are impossible (see opencloud/opencloud.yml); a dead coolwsd
    # surfaces as Traefik 502.
    healthcheck: false
    networks: [opensme-net]
    env:
      - COLLABORA_DOMAIN
      - COLLABORA_USERNAME
      - COLLABORA_PASSWORD
    traefik_labels: true
    resource_limits:
      memory: 4G

  minio:
    image: minio/minio:latest
    compose_file: opencloud/minio.yml
    required: false
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    volumes:
      - minio-data:/data
    env:
      - OC_S3_ACCESS_KEY
      - OC_S3_SECRET_KEY
    traefik_labels: true
    resource_limits:
      memory: 2G
