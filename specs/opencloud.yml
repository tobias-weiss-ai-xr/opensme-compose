# ═══════════════════════════════════════════════════════════════
# specs/opencloud.yml — File sync, collaboration, S3 storage
# ═══════════════════════════════════════════════════════════════

services:
  opencloud:
    # 9.1.0-nix (2026-11-13): our own build from source (opencloud-nix 9b1901a)
    # with klauspost/compress v1.20.2 — fixes GO-2026-6865 (panic on two-block
    # frames); upstream 8.0.1/rolling still ships the vulnerable v1.20.1.
    # sha256:19eec92c19a5110b3900bf730be789bdc536c10beeb826b064b160120d7e869e
    # Compose tracks the public ghcr mirror (same digest); the private alias
# registry.openedusuite.org/openedusuite-nix/opencloud:9.1.0-nix serves the
# identical image.
    image: ghcr.io/tobias-weiss-ai-xr/opencloud:9.1.0
    compose_file: opencloud/opencloud.yml
    required: false
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    volumes:
      - opencloud-config:/etc/opencloud
      - opencloud-data:/var/lib/opencloud
    env:
      - OPENCLOUD_DOMAIN
      - OC_ADMIN_USERNAME
      - OC_ADMIN_PASSWORD
      - OC_OIDC_CLIENT_ID       # Zitadel-minted, persisted by scripts/zitadel-client.sh
      - OC_OIDC_CLIENT_SECRET   # canonical key (OC_OIDC_SECRET kept as legacy alias only)
      - OC_S3_ENDPOINT
      - OC_S3_ACCESS_KEY
      - OC_S3_SECRET_KEY
      - NOTIFICATIONS_SMTP_SENDER
    traefik_labels: true
    resource_limits:
      memory: 4G

  collabora:
    image: ${COLLABORA_IMAGE:-collabora/code:latest}
    compose_file: opencloud/opencloud.yml
    required: false
    host_ports: []
    # collabora/code 26.04 ships no curl/wget/shell — in-container health-
    # checks are impossible (see opencloud/opencloud.yml); a dead coolwsd
    # surfaces as Traefik 502.
    healthcheck: false
    networks: [opensme-net]
    env:
      - COLLABORA_DOMAIN
      - COLLABORA_USERNAME
      - COLLABORA_PASSWORD
    traefik_labels: true
    resource_limits:
      memory: 4G

  seaweedfs:
    # SeaweedFS S3 (replaces MinIO; minio-data volumes are cold backup only)
    image: registry.hrz.uni-marburg.de/dockerio-cache/chrislusf/seaweedfs:latest
    compose_file: opencloud/minio.yml
    required: false
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    volumes:
      - seaweedfs-data:/data
    env: []
    traefik_labels: true
    resource_limits:
      memory: 1.5G
