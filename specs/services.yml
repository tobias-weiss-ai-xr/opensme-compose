# ═══════════════════════════════════════════════════════════════
# specs/services.yml — Optional service overlays
# ═══════════════════════════════════════════════════════════════
# Each service is gated behind a Docker Compose profile.
# Enable via: docker compose --profile <name> up -d

services:
  invoiceninja:
    # local build: upstream image lacks pdo_pgsql (see services/invoice-ninja/Dockerfile)
    image: invoiceninja-pg:5
    compose_file: services/invoice-ninja.yml
    required: false
    profiles: [invoice]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [invoiceninja-db, redis]
    volumes:
      - invoiceninja-public:/var/www/app/public
      - invoiceninja-storage:/var/www/app/storage
    env:
      - INVOICENINJA_DB_PASSWORD
    # Traefik labels live on the invoiceninja-web nginx front, not on the fpm app
    traefik_labels: false
    resource_limits:
      memory: 192M

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    compose_file: services/paperless.yml
    required: false
    profiles: [paperless]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres, redis]
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
    env:
      - PAPERLESS_DB_PASSWORD
      - PAPERLESS_SECRET_KEY
    traefik_labels: true
    resource_limits:
      memory: 384M

  paperless-gotenberg:
    image: gotenberg/gotenberg:latest
    compose_file: services/paperless.yml
    required: false
    profiles: [paperless]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    traefik_labels: false
    resource_limits:
      memory: 96M

  paperless-tika:
    image: ${TIKA_IMAGE:-apache/tika:latest}
    compose_file: services/paperless.yml
    required: false
    profiles: [tika]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    traefik_labels: false
    resource_limits:
      memory: 512M

  cryptpad:
    image: cryptpad/cryptpad:latest
    compose_file: services/cryptpad.yml
    required: false
    profiles: [collab]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    volumes:
      - cryptpad-data:/cryptpad/data
      - cryptpad-blob:/cryptpad/blob
    env:
      - CRYPTPAD_ADMIN_EMAIL
      - CPAD_SESSION_SECRET
    traefik_labels: true
    resource_limits:
      memory: 256M

  synapse:
    image: matrixdotorg/synapse:latest
    compose_file: services/synapse.yml
    required: false
    profiles: [chat]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    volumes:
      - synapse-data:/data
    env:
      - SYNAPSE_DB_PASSWORD
      - SYNAPSE_OIDC_CLIENT_SECRET
    traefik_labels: true
    resource_limits:
      memory: 384M

  element-web:
    image: vectorim/element-web:latest
    compose_file: services/element.yml
    required: false
    profiles: [element]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    traefik_labels: true
    resource_limits:
      memory: 48M

  notes-backend:
    image: lasuite/impress:latest-backend
    compose_file: services/notes.yml
    required: false
    profiles: [notes]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    volumes:
      - notes-data:/data
    env:
      - NOTES_DB_PASSWORD
      - NOTES_DJANGO_SECRET_KEY
      - NOTES_OIDC_CLIENT_SECRET
      - NOTES_COLLABORATION_SECRET
    traefik_labels: false
    resource_limits:
      memory: 256M

  notes-frontend:
    image: lasuite/impress:latest-frontend
    compose_file: services/notes.yml
    required: false
    profiles: [notes]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [notes-backend]
    traefik_labels: true
    resource_limits:
      memory: 64M

  notes-y-provider:
    image: lasuite/impress:latest-y-provider
    compose_file: services/notes.yml
    required: false
    profiles: [notes]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    env:
      - NOTES_COLLABORATION_SECRET
    traefik_labels: false
    resource_limits:
      memory: 64M

  nosdesk:
    image: ghcr.io/nosdesk/nosdesk:1.0.12
    compose_file: services/ticketing.yml
    required: false
    profiles: [ticketing]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres, redis]
    volumes:
      - nosdesk-uploads:/app/uploads
    env:
      - NOSDESK_DB_PASSWORD
      - NOSDESK_JWT_SECRET
      - NOSDESK_MFA_KEK
    traefik_labels: true
    resource_limits:
      memory: 1G

  cms:
    # upstream publishes :latest only (0 releases as of 2026-10)
    image: ghcr.io/dkluhzeb/crap-cms:latest
    compose_file: services/cms.yml
    required: false
    profiles: [cms]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: []
    volumes:
      - cms-data:/config
    env: []
    traefik_labels: true
    resource_limits:
      memory: 512M

  store:
    # local build from the pinned v0.4.2 release artifact (sha256-verified)
    image: raisfast:0.4.2
    compose_file: services/store.yml
    required: false
    profiles: [store]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: []
    volumes:
      - store-data:/data
    env:
      - STORE_ADMIN_PASSWORD
    traefik_labels: true
    resource_limits:
      memory: 512M

  ai:
    # build-numbered tag (no semver docker tags published)
    image: ghcr.io/ggml-org/llama.cpp:server-b11223
    compose_file: services/ai.yml
    required: false
    profiles: [ai]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: []
    volumes:
      - ai-models:/models
    env:
      - AI_HF_MODEL
    traefik_labels: true
    resource_limits:
      memory: 2G

  camunda:
    # Operaton (community successor of Camunda 7 CE) — BPMN 2.0 workflow & decision engine
    image: operaton/operaton:2.1.5
    compose_file: services/camunda.yml
    required: false
    profiles: [camunda]
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    volumes:
      - camunda-data:/operaton/configuration/userlib
    env:
      - CAMUNDA_DB_PASSWORD
      - CAMUNDA_DOMAIN
    traefik_labels: true
    resource_limits:
      memory: 1G
