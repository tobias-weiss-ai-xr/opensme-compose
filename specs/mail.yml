# ═══════════════════════════════════════════════════════════════
# specs/mail.yml — Mail server and groupware
# ═══════════════════════════════════════════════════════════════
#
# Mail backend switch (strict XOR — MAIL_BACKEND=stalwart|mailcow, never
# both; they would fight over mail.* and the SMTP/IMAP host ports):
#   stalwart (default) — these Stalwart/SOGo services.
#   mailcow            — the pinned mailcow-dockerized submodule driven by
#                        scripts/mailcow.sh (MAIL_BACKEND=mailcow). Stalwart
#                        and SOGo must not be mounted in that mode.

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.15
    compose_file: mail/stalwart.yml
    required: false
    host_ports: [25, 143, 587]  # SMTP, IMAP, Submission (TLS terminated by Traefik)
    healthcheck: true
    networks: [opensme-net]
    volumes:
      - stalwart-etc:/opt/stalwart/etc
      - stalwart-data:/var/lib/stalwart
    env:
      - STALWART_ADMIN_PASSWORD
      - MAIL_DOMAIN
    traefik_labels: true
    resource_limits:
      memory: 2G

  sogo:
    image: salvoxia/sogo:latest
    compose_file: mail/sogo.yml
    required: false
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    volumes:
      - sogo-config:/etc/sogo
      - sogo-data:/var/lib/sogo
    env:
      - SOGO_DOMAIN
      - SOGO_DB_PASSWORD
      - LDAP_ROOT_DN
      - LDAP_ADMIN_PASSWORD
      - LDAP_USER_PASSWORD
    traefik_labels: true
    resource_limits:
      memory: 2G
